<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atlasia — Knowledge Platform</title>
<style>
:root{
  --bg:#0b0d0f;
  --sidebar:#0f1115;
  --panel:#12151a;
  --panel-2:#161a20;
  --panel-3:#1b2027;
  --text:#e6e9ed;
  --text-soft:#c0c6ce;
  --muted:#7f8792;
  --faint:#5f6772;
  --line:#242a32;
  --line-2:#303742;
  --accent:#a78bfa;
  --accent-2:#c4b5fd;
  --accent-bg:#211c35;
  --danger:#f28b9c;
  --danger-bg:#321a22;
  --success:#75d09b;
  --radius:10px;
  --content-width:1120px;
  --sidebar-width:245px;
  --right-width:220px;
  --shadow:0 18px 60px rgba(0,0,0,.32);
}

*{box-sizing:border-box}
html{background:var(--bg);color-scheme:dark}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
  letter-spacing:-.01em;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
::selection{background:rgba(167,139,250,.27);color:#fff}
*{scrollbar-width:thin;scrollbar-color:#333a44 transparent}

/* Header */
.top{
  height:58px;
  padding:0 16px;
  display:flex;
  align-items:center;
  gap:10px;
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(11,13,15,.91);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.logo{
  min-width:185px;
  font-size:19px;
  font-weight:900;
  letter-spacing:-.8px;
  color:var(--accent-2);
  cursor:pointer;
}
.logo span{color:var(--text)}
.search{
  position:relative;
  flex:1;
  max-width:720px;
}
.search:before{
  content:"⌕";
  position:absolute;
  left:12px;
  top:4px;
  color:var(--muted);
  font-size:22px;
  pointer-events:none;
}
.search input{
  width:100%;
  height:36px;
  padding:0 75px 0 36px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#111419;
  color:var(--text);
  outline:0;
  transition:.15s;
}
.search input::placeholder{color:#69717c}
.search input:focus{
  border-color:#454d59;
  background:var(--panel);
  box-shadow:0 0 0 3px rgba(167,139,250,.06);
}
.actions{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:6px;
}
.btn{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--panel-2);
  color:var(--text-soft);
  font-weight:700;
  font-size:13px;
  transition:.14s;
}
.btn:hover{background:var(--panel-3);border-color:var(--line-2);color:var(--text)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#120d1e}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.danger{background:var(--danger-bg);border-color:#4b232d;color:#ff9eae}
.btn.sm{padding:5px 8px;font-size:11px}
.user{
  display:flex;
  align-items:center;
  gap:7px;
  padding:2px 4px 2px 2px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#111419;
}
.user img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.user span{
  max-width:115px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:12px;
  font-weight:700;
}

/* Three-zone application shell */
.layout{
  display:grid;
  grid-template-columns:var(--sidebar-width) minmax(0,1fr);
  max-width:1540px;
  margin:0 auto;
}
.side{
  min-height:calc(100vh - 58px);
  height:calc(100vh - 58px);
  position:sticky;
  top:58px;
  overflow:auto;
  padding:16px 11px 30px;
  background:var(--sidebar);
  border-right:1px solid var(--line);
}
.navtitle{
  margin:17px 9px 6px;
  color:#626a76;
  font-size:10px;
  font-weight:850;
  letter-spacing:.09em;
  text-transform:uppercase;
}
.nav{
  padding:7px 9px;
  margin:1px 0;
  display:flex;
  align-items:center;
  gap:8px;
  border-radius:7px;
  color:#979faa;
  font-size:13px;
  font-weight:650;
  cursor:pointer;
  transition:.12s;
}
.nav:hover{background:#15191f;color:var(--text)}
.nav.active{background:var(--accent-bg);color:var(--accent-2)}
.main{
  min-width:0;
  padding:31px 34px 70px;
  max-width:calc(var(--content-width) + var(--right-width) + 80px);
  width:100%;
  margin:0 auto;
}

/* Common */
h1,h2,h3,h4{color:var(--text)}
.muted{color:var(--muted)}
.section{margin-top:31px}
.sectionhead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:12px;
}
.section h2{margin:0;font-size:19px;letter-spacing:-.4px}
.empty{
  padding:44px 20px;
  text-align:center;
  color:var(--muted);
  background:var(--panel);
  border:1px dashed var(--line-2);
  border-radius:10px;
}

/* Home */
.hero{
  padding:36px 34px;
  background:
    linear-gradient(110deg,rgba(167,139,250,.09),transparent 55%),
    var(--panel);
  border:1px solid var(--line);
  border-radius:13px;
  box-shadow:var(--shadow);
}
.hero h1{
  max-width:760px;
  margin:0 0 12px;
  font-size:39px;
  line-height:1.1;
  letter-spacing:-1.7px;
}
.hero p{
  max-width:760px;
  margin:0 0 21px;
  color:var(--text-soft);
  line-height:1.7;
  font-size:14.5px;
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.stat{
  padding:15px 17px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:9px;
}
.stat b{font-size:20px;letter-spacing:-.5px}
.stat small{display:block;margin-top:3px;color:var(--muted);font-size:11px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{
  display:flex;
  flex-direction:column;
  min-height:150px;
  padding:16px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  cursor:pointer;
  transition:.14s;
}
.card:hover{
  background:var(--panel-2);
  border-color:#353d48;
  transform:translateY(-1px);
}
.card .icon{
  width:31px;height:31px;
  display:grid;place-items:center;
  border:1px solid #302b49;
  border-radius:7px;
  background:var(--accent-bg);
  color:var(--accent-2);
}
.card h3{font-size:15px;margin:10px 0 6px}
.card p{font-size:12.5px;line-height:1.55;color:var(--muted);margin:0;flex:1}
.meta{margin-top:11px;font-size:10.5px;color:var(--faint)}
.tag{
  display:inline-block;
  margin:8px 3px 0 0;
  padding:2px 6px;
  border-radius:5px;
  background:#181c22;
  border:1px solid #292f37;
  color:#aeb4bf;
  font-size:9.5px;
  font-weight:750;
}

/* Article workspace */
.article{
  width:100%;
  max-width:var(--content-width);
  margin:0 auto;
}
.crumb-container{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  margin-bottom:14px;
  color:var(--muted);
  font-size:11.5px;
}
.crumb-item{color:#a99af0;cursor:pointer}
.crumb-item:hover{text-decoration:underline}
.crumb-sep{color:#4e5661}
.article h1{
  margin:0 0 7px;
  font-size:38px;
  line-height:1.1;
  letter-spacing:-1.4px;
}
.lead{
  margin:0 0 14px;
  max-width:780px;
  color:var(--muted);
  font-size:15px;
  line-height:1.65;
}
.articlegrid{
  display:grid;
  grid-template-columns:minmax(0,1fr) var(--right-width);
  gap:31px;
  align-items:start;
  margin-top:18px;
}
.content{
  min-width:0;
  background:transparent;
  border:0;
  padding:0 0 20px;
  color:#d2d7de;
  font-size:15.5px;
  line-height:1.82;
}
.content p{max-width:780px}
.content h2{
  margin:31px 0 11px;
  padding:0 0 7px;
  border-bottom:1px solid var(--line);
  font-size:21px;
  letter-spacing:-.5px;
}
.content blockquote{
  max-width:780px;
  margin:19px 0;
  padding:11px 15px;
  border-left:2px solid var(--accent);
  background:rgba(167,139,250,.055);
  border-radius:0 7px 7px 0;
  color:#c7c2dc;
}
.info{
  position:sticky;
  top:77px;
  height:max-content;
  padding-left:17px;
  border-left:1px solid var(--line);
  background:transparent;
}
.info h3{
  margin:0 0 8px;
  font-size:10px;
  color:#717985;
  text-transform:uppercase;
  letter-spacing:.09em;
}
.row{
  display:flex;
  flex-direction:column;
  gap:2px;
  padding:8px 0;
  border-top:1px solid var(--line);
  font-size:11.5px;
}
.row b{color:#707985;font-size:10px;font-weight:700}
.subpages-box{
  margin-top:28px;
  padding:17px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
}
.subpages-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:11px;
}
.subpages-header h3{margin:0;font-size:15px}
.subpages-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.subpage-card{
  padding:12px;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:8px;
  cursor:pointer;
}
.subpage-card:hover{background:var(--panel-3);border-color:#38404c}
.subpage-card h4{margin:0 0 4px;font-size:13px;color:#b3a7f6}
.subpage-card p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.45}

/* Tree */
.tree-card{
  padding:13px;
  margin-bottom:17px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:9px;
}
.tree-title{
  margin-bottom:9px;
  color:#69727e;
  font-size:9.5px;
  font-weight:850;
  text-transform:uppercase;
  letter-spacing:.09em;
}
.tree-list{list-style:none;padding:0;margin:0}
.tree-list.nested{
  margin-left:9px;
  padding-left:15px;
  border-left:1px solid #292f38;
}
.tree-item{margin:2px 0}
.tree-node{
  display:flex;
  align-items:center;
  gap:7px;
  padding:5px 7px;
  border-radius:6px;
  color:#9da5b0;
  font-size:12px;
  font-weight:650;
  cursor:pointer;
}
.tree-node:hover{background:#171b21;color:var(--text)}
.tree-node.active{background:var(--accent-bg);color:var(--accent-2)}
.tree-icon{color:#69727e;font-size:10px}

/* Explore */
.explore{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.cat{
  padding:16px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:9px;
  cursor:pointer;
  transition:.14s;
}
.cat:hover{background:var(--panel-2);border-color:#353d48}
.cat .icon{font-size:15px;color:var(--accent-2)}
.cat b{display:block;margin-top:10px;font-size:13px}
.cat small{display:block;margin-top:3px;color:var(--muted);font-size:11px;line-height:1.4}

/* Editor */
.editor{width:100%;max-width:900px;margin:0 auto}
.title{
  width:100%;
  padding:6px 0 13px;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  font-size:31px;
  font-weight:850;
  letter-spacing:-1.1px;
}
.title::placeholder{color:#4c545f}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:7px 0}
.field{
  width:100%;
  padding:9px 11px;
  border:1px solid var(--line);
  border-radius:8px;
  outline:0;
  background:var(--panel);
  color:var(--text);
}
.field::placeholder{color:#69717d}
.field:focus{border-color:#48515e;box-shadow:0 0 0 3px rgba(167,139,250,.055)}
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  padding:6px;
  background:var(--panel);
  border:1px solid var(--line);
  border-bottom:0;
  border-radius:9px 9px 0 0;
}
.tool{
  padding:5px 8px;
  border:1px solid var(--line);
  border-radius:6px;
  background:var(--panel-2);
  color:var(--text-soft);
  font-weight:800;
}
.tool:hover{background:var(--panel-3)}
.editor textarea{
  display:block;
  width:100%;
  min-height:430px;
  padding:18px;
  border:1px solid var(--line);
  border-radius:0 0 9px 9px;
  outline:0;
  resize:vertical;
  background:#0f1216;
  color:#d5dae1;
  line-height:1.7;
}
.editor textarea:focus{border-color:#48515e}
.editorbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:10px;
}

/* Profile / lists */
.profile{display:grid;grid-template-columns:220px minmax(0,1fr);gap:13px}
.box{
  padding:18px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
}
.avatar{width:68px;height:68px;border-radius:50%;object-fit:cover;background:var(--panel-3)}
.listrow{padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.listrow:last-child{border-bottom:0}
.listrow h3{margin:0 0 4px;font-size:14px}
.listrow p{margin:0;color:var(--muted);font-size:12px}

/* Collaboration */
.badge{
  display:inline-block;
  padding:2px 7px;
  border:1px solid #2b313a;
  border-radius:999px;
  background:#181c21;
  color:#929aa5;
  font-size:9px;
  font-weight:800;
}
.badge.owner{background:#302617;color:#e3ac63;border-color:#4b3920}
.badge.editor{background:#172936;color:#72b9df;border-color:#254352}
.badge.contributor{background:#172b21;color:#70c48d;border-color:#244936}
.badge.viewer{background:#181c21;color:#8e97a3}
.grouphead{margin:18px 0 8px;color:#6f7782;font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.06em}
.memberrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.memberrow:first-child{border-top:0}
.memberrow span.who{flex:1;font-size:12px;font-weight:700}
.memberrow select{
  padding:4px 6px;
  border:1px solid var(--line);
  border-radius:6px;
  background:var(--panel-2);
  color:var(--text);
}
.invite{display:flex;gap:6px;margin-top:11px}
.invite input{flex:1}

/* Revisions */
.revrow{
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px 0;
  border-top:1px solid var(--line);
  cursor:pointer;
}
.revrow:first-child{border-top:0}
.revrow:hover{background:#15191f}
.revrow .v{font-weight:850}
.revrow.selected{background:var(--accent-bg)}
.diffwrap{
  padding:17px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:9px;
  font-size:13px;
  line-height:1.75;
}
.diffadd{padding:0 2px;background:#173321;color:#75d19a;border-radius:3px}
.diffdel{padding:0 2px;background:#351b23;color:#ff93a5;border-radius:3px;text-decoration:line-through}

/* Modal + toast */
.modal-overlay{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(5px);
}
.modal-card{
  width:100%;
  max-width:430px;
  padding:21px;
  background:var(--panel-2);
  border:1px solid var(--line-2);
  border-radius:11px;
  box-shadow:var(--shadow);
}
.modal-card h3{margin:0 0 8px;font-size:18px}
.modal-card p{margin:0 0 17px;color:var(--muted);font-size:13px;line-height:1.55}
.modal-actions{display:flex;justify-content:flex-end;gap:7px}
.toast{
  position:fixed;
  right:16px;
  bottom:16px;
  z-index:9999;
  padding:9px 13px;
  border:1px solid #d6d9de;
  border-radius:8px;
  background:#e8eaee;
  color:#111318;
  box-shadow:var(--shadow);
  font-size:12px;
  font-weight:750;
}

/* Focus */
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

/* Responsive */
@media(max-width:1150px){
  :root{--sidebar-width:215px;--right-width:190px}
  .main{padding:27px 25px}
  .cards{grid-template-columns:repeat(2,1fr)}
  .explore{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:900px){
  .logo{min-width:110px}
  .side{display:none}
  .layout{display:block}
  .main{padding:23px 20px}
  .articlegrid{grid-template-columns:1fr}
  .info{
    position:static;
    padding:14px 0 0;
    border-left:0;
    border-top:1px solid var(--line);
  }
  .profile{grid-template-columns:1fr}
  .subpages-grid{grid-template-columns:1fr}
}
@media(max-width:600px){
  .top{padding:0 9px}
  .logo{min-width:auto;font-size:18px}
  .search input{padding-right:10px}
  .actions .btn{display:none}
  .user span{display:none}
  .main{padding:16px 13px 50px}
  .hero{padding:26px 21px}
  .hero h1{font-size:29px}
  .stats,.cards,.explore,.fields{grid-template-columns:1fr}
  .article h1{font-size:29px}
  .articlegrid{gap:17px}
  .content{font-size:15px}
  .editor textarea{min-height:330px}
  .editorbar{align-items:stretch;flex-direction:column}
}

</style>
</head>
<body>
<header class="top">
  <div class="logo" onclick="home()">Atlas<span>ia</span></div>
  <div class="search"><input id="search" aria-label="Cari di Atlasia" aria-label="Cari artikel, sub-halaman, space..." placeholder="Cari di Atlasia..." onkeydown="if(event.key==='Enter')searchArticles()"></div>
  <div class="actions">
    <button class="btn" onclick="explore()">Jelajah</button>
    <button class="btn primary" onclick="requireLogin()">＋ Buat</button>
    <div id="account"></div>
  </div>
</header>
<div class="layout">
<aside class="side">
  <div class="navtitle">Navigasi</div>
  <div class="nav active" id="nav-home" onclick="home()">⌂ Beranda</div>
  <div class="nav" id="nav-explore" onclick="explore()">◈ Jelajah</div>
  <div class="nav" id="nav-spaces" onclick="spacesPage()">🌎 Space</div>
  <div class="nav" id="nav-saved" onclick="saved()">☆ Tersimpan</div>
  <div class="navtitle">Akun</div>
  <div class="nav" onclick="profile()">● Profil saya</div>
  <div class="nav" onclick="requireLogin()">＋ Buat artikel</div>
  <div class="navtitle">Status System</div>
  <div class="nav" onclick="about()">? Status backend</div>
</aside>
<main class="main" id="main"></main>
</div>

<script type="module">

  onSnapshot, query, where, orderBy, limit, serverTimestamp, increment, deleteField
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  authDomain:"first-prototype-wiki.firebaseapp.com",
  projectId:"first-prototype-wiki",
  storageBucket:"first-prototype-wiki.firebasestorage.app",
  messagingSenderId:"506146325520",
  appId:"1:506146325520:web:8266348a56eb9b3cae3695",
  measurementId:"G-E1XZ1F6X42"
};

const app=initializeApp(firebaseConfig);
try{getAnalytics(app)}catch(e){}
const auth=getAuth(app), db=getFirestore(app);
const provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});

let user=null, articles=[], spaces=[], unsub=null, unsubSpaces=null, editingId=null, editingSpaceId=null;

function parseHashArticleId(){const m=location.hash.match(/^#\/article\/(.+)$/);return m?decodeURIComponent(m[1]):null}
function findSpace(id){return spaces.find(s=>s.id===id)||demoSpaces.find(s=>s.id===id)}
function spaceRole(space){
 if(!space||!user)return null;
 if(space.ownerId===user.uid)return "owner";
 return space.members?.[user.uid]||null;
}
function canCreateInSpace(space){const r=spaceRole(space);return r==="owner"||r==="editor"||r==="contributor"}
function canManageSpace(space){return spaceRole(space)==="owner"}
function canEditArticle(a){
 if(!user)return false;
 if(a.ownerId===user.uid||a.authorId===user.uid)return true;
 if(a.spaceId){const r=spaceRole(findSpace(a.spaceId));if(r==="owner"||r==="editor")return true}
 return false;
}
function canDeleteArticle(a){return canEditArticle(a)}
function roleLabel(r){return {owner:"Owner",editor:"Editor",contributor:"Contributor",viewer:"Viewer"}[r]||"Viewer"}

/* Modal Dialog Helper (Replacing alert/confirm) */
function showModal({title, message, confirmText="Ya, Lanjutkan", cancelText="Batal", onConfirm}) {
 const el=document.createElement("div");
 el.className="modal-overlay";
 el.innerHTML=`<div class="modal-card"><h3>${esc(title)}</h3><p>${esc(message)}</p><div class="modal-actions"><button class="btn" id="m-cancel">${esc(cancelText)}</button>${onConfirm?`<button class="btn danger" id="m-ok">${esc(confirmText)}</button>`:""}</div></div>`;
 document.body.appendChild(el);
 el.querySelector("#m-cancel").onclick=()=>el.remove();
 if(onConfirm){
   el.querySelector("#m-ok").onclick=()=>{
     el.remove();
     onConfirm();
   };
 }
}

/* Breadcrumb Builder */
function getBreadcrumbs(articleId){
 const all=[...articles,...demo];
 const trail=[];
 let curr=all.find(a=>a.id===articleId);
 const visited=new Set();
 while(curr && !visited.has(curr.id)){
   visited.add(curr.id);
   trail.unshift(curr);
   if(curr.parentId){
     curr=all.find(a=>a.id===curr.parentId);
   } else {
     break;
   }
 }
 return trail;
}

/* Tree Component Renderer for Space / Root Article */
function renderTreeHTML(parentId=null, spaceId=null, currentArticleId=null, level=0){
 const all=[...articles,...demo];
 const children=all.filter(a=>{
   if(spaceId && a.spaceId!==spaceId)return false;
   if(parentId===null)return !a.parentId;
   return a.parentId===parentId;
 });
 if(!children.length)return "";
 return `<ul class="tree-list ${level>0?"nested":""}">`+children.map(child=>{
   const sub=renderTreeHTML(child.id, spaceId, currentArticleId, level+1);
   const isActive=child.id===currentArticleId?"active":"";
   return `<li class="tree-item">
     <div class="tree-node ${isActive}" onclick='window.openArticle(${JSON.stringify(child.id)})'>
       <span class="tree-icon">${sub?"📂":"📄"}</span>
       <span>${esc(child.title)}</span>
     </div>
     ${sub}
   </li>`;
 }).join("")+`</ul>`;
}

function openArticle(id){
 const all=[...articles,...demo];
 let a=all.find(x=>x.id===id);if(!a)return;
 history.pushState({articleId:id},'','#/article/'+encodeURIComponent(id));
 
 const isDemo=String(a.id).startsWith("demo-");
 if(!isDemo && !viewedArticlesThisSession.has(id)){
   viewedArticlesThisSession.add(id);
   updateDoc(doc(db,"articles",id),{views:increment(1)}).catch(e=>console.warn("View count error:",e));
 }
 renderArticleUI(id);
}
window.openArticle=openArticle;

async function login(){
  if(location.protocol === "file:"){
    showModal({title:"Perhatian Domain", message:"Untuk menggunakan autentikasi Google, jalankan aplikasi ini via HTTP/HTTPS local server atau hosting web."});
    return;
  }
  try{
    const mobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
    if(mobile) await signInWithRedirect(auth,provider);
    else await signInWithPopup(auth,provider);
  }catch(e){
    toast("Login gagal: "+(e.code||e.message));
  }
}

function subscribeSpaces(){
 if(unsubSpaces)unsubSpaces();
 const q=query(collection(db,"spaces"),limit(100));
 unsubSpaces=onSnapshot(q,snap=>{
   spaces=snap.docs.map(d=>({id:d.id,...d.data()}));
   spaces.sort((a,b)=>(a.name||"").localeCompare(b.name||""));
   rerenderCurrent();
 },err=>{
   spaces=[];
 });
}

function subscribeArticles(){
 if(unsub)unsub();
 const q=query(collection(db,"articles"),limit(100));
 unsub=onSnapshot(q,snap=>{
   articles=snap.docs.map(d=>({id:d.id,...d.data()}));
   articles.sort((a,b)=>{
     const ta=a.updatedAt?.toMillis?.()||0, tb=b.updatedAt?.toMillis?.()||0;
     return tb-ta;
   });
   if(!subscribeArticles.booted){
     subscribeArticles.booted=true;
     const hid=parseHashArticleId();
     if(hid && ([...articles,...demo].find(a=>a.id===hid))){renderArticleUI(hid);return}
   }
   rerenderCurrent();
 },err=>{
   articles=[]; rerenderCurrent();
 });
}

function markdown(s){return s.split(/\n\s*\n/).map(x=>{x=x.trim();if(!x)return "";if(x.startsWith("## "))return "<h2>"+esc(x.slice(3))+"</h2>";if(x.startsWith("# "))return "<h2>"+esc(x.slice(2))+"</h2>";if(x.startsWith("> "))return "<blockquote>"+esc(x.slice(2))+"</blockquote>";return "<p>"+esc(x).replace(/\*\*(.*?)\*\*/g,"<b>$1</b>").replace(/\*(.*?)\*/g,"<i>$1</i>")+"</p>"}).join("")}
function plain(html){return html.replace(/<h2>(.*?)<\/h2>/gi,"## $1\n\n").replace(/<blockquote>(.*?)<\/blockquote>/gi,"> $1\n\n").replace(/<p>(.*?)<\/p>/gi,"$1\n\n").replace(/<[^>]+>/g,"").trim()}

async function saveArticle(){
 if(!user)return login();
 const title=document.getElementById("etitle").value.trim()||"Tanpa judul",
       category=document.getElementById("ecat").value.trim()||"Lainnya",
       tags=document.getElementById("etags").value.split(",").map(x=>x.trim()).filter(Boolean),
       desc=document.getElementById("edesc").value.trim(),
       content=markdown(document.getElementById("ebody").value),
       spaceId=document.getElementById("espace").value||null,
       parentId=document.getElementById("eparent").value||null;

 try{
  if(editingId){
   const ref=doc(db,"articles",editingId),snap=await getDoc(ref);
   if(!snap.exists()||!canEditArticle({...snap.data(),id:editingId}))return toast("Tidak punya izin mengedit.");
   const newVersion=(snap.data().version||1)+1;
   const patch={title,category,tags,desc,content,version:newVersion,updatedAt:serverTimestamp()};
   if(spaceId)patch.spaceId=spaceId;else patch.spaceId=deleteField();
   if(parentId)patch.parentId=parentId;else patch.parentId=deleteField();

   await updateDoc(ref,patch);
   await addDoc(collection(db,"articles",editingId,"revisions"),{
     version:newVersion,title,category,tags,desc,content,editedBy:user.uid,editedByName:user.displayName||"Kontributor",editedAt:serverTimestamp()
   });
   toast("Artikel berhasil diperbarui");
  }else{
   const base={
     title,category,tags,desc,content,authorId:user.uid,authorName:user.displayName||"Kontributor",authorPhoto:user.photoURL||"",
     ownerId:user.uid,views:0,version:1,createdAt:serverTimestamp(),updatedAt:serverTimestamp()
   };
   if(spaceId)base.spaceId=spaceId;
   if(parentId)base.parentId=parentId;

   const ref=await addDoc(collection(db,"articles"),base);
   await addDoc(collection(db,"articles",ref.id,"revisions"),{
     version:1,title,category,tags,desc,content,editedBy:user.uid,editedByName:user.displayName||"Kontributor",editedAt:serverTimestamp()
   });
   toast("Artikel diterbitkan");
   editingId=ref.id;
  }
  setTimeout(()=>window.openArticle(editingId),400);
 }catch(e){console.error(e);toast("Gagal menyimpan: "+(e.code||e.message))}
}
window.saveArticle=saveArticle;

/* Revision History & Diff Comparison */
let revCompareSelection=[];
function diffWords(oldText,newText){
 const a=oldText.split(/(\s+)/),b=newText.split(/(\s+)/);
 const dp=Array.from({length:a.length+1},()=>new Array(b.length+1).fill(0));
 for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 let i=0,j=0,out=[];
 while(i<a.length&&j<b.length){
  if(a[i]===b[j]){out.push(esc(a[i]));i++;j++}
  else if(dp[i+1][j]>=dp[i][j+1]){out.push(`<span class="diffdel">${esc(a[i])}</span>`);i++}
  else{out.push(`<span class="diffadd">${esc(b[j])}</span>`);j++}
 }
 while(i<a.length){out.push(`<span class="diffdel">${esc(a[i])}</span>`);i++}
 while(j<b.length){out.push(`<span class="diffadd">${esc(b[j])}</span>`);j++}
 return out.join("");
}

 revCompareSelection=[];
 try{
  const q=query(collection(db,"articles",articleId,"revisions"),orderBy("version","desc"),limit(50));
  const snap=await getDocs(q);
  const revs=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderRevisionList(articleId,revs);
 }catch(e){console.error(e);toast("Gagal memuat riwayat versi: "+(e.code||e.message))}
}

function renderRevisionList(articleId,revs){
 document.getElementById("main").innerHTML=`<div class="crumb-container"><span class="crumb-item" onclick='window.renderArticleUI(${JSON.stringify(articleId)})'>← Kembali ke Artikel</span></div><h1>🕐 Riwayat Versi</h1><p class="muted">Klik dua versi untuk membandingkan perubahan (Diff), atau buka satu versi untuk melihat isi / memulihkan.</p><div class="box" style="padding:8px 20px" id="revlist">${revs.map(r=>`<div class="revrow" data-rid="${esc(r.id)}"><span class="v">Versi ${r.version}</span><span class="muted" style="flex:1">${esc(r.editedByName||"")} · ${r.editedAt?.toDate?.()?.toLocaleString("id-ID")||"baru saja"}</span><button class="btn sm" onclick='event.stopPropagation();window.viewRevision(${JSON.stringify(articleId)},${JSON.stringify(r.id)})'>Lihat Versi</button></div>`).join("")}</div><div id="revaction" style="margin-top:16px"></div>`;
 document.querySelectorAll("#revlist .revrow").forEach(row=>{
  row.addEventListener("click",()=>{
   const rid=row.dataset.rid;
   const idx=revCompareSelection.indexOf(rid);
   if(idx>-1){revCompareSelection.splice(idx,1);row.classList.remove("selected")}
   else{if(revCompareSelection.length>=2){const first=revCompareSelection.shift();document.querySelector(`#revlist .revrow[data-rid="${first}"]`)?.classList.remove("selected")}revCompareSelection.push(rid);row.classList.add("selected")}
   const box=document.getElementById("revaction");
   if(revCompareSelection.length===2)box.innerHTML=`<button class="btn primary" onclick='window.compareRevisions(${JSON.stringify(articleId)},${JSON.stringify(revCompareSelection[0])},${JSON.stringify(revCompareSelection[1])})'>Bandingkan 2 Versi Terpilih</button>`;
   else box.innerHTML="";
  });
 });
}

async function viewRevision(articleId,revId){
 try{
  const snap=await getDoc(doc(db,"articles",articleId,"revisions",revId));
  if(!snap.exists())return toast("Versi tidak ditemukan");
  const r=snap.data();
  const a=articles.find(x=>x.id===articleId);
  const isLatest=a && r.version===a.version;
  document.getElementById("main").innerHTML=`<div class="crumb-container"><span class="crumb-item" onclick='window.openRevisions(${JSON.stringify(articleId)})'>← Riwayat Versi</span></div><h1>${esc(r.title)} <span class="badge">Versi ${r.version}</span></h1><p class="muted">Diedit oleh ${esc(r.editedByName||"")} pada ${r.editedAt?.toDate?.()?.toLocaleString("id-ID")||""}</p>${!isLatest && a && canEditArticle(a)?`<button class="btn primary" style="margin-bottom:16px" onclick='window.restoreRevision(${JSON.stringify(articleId)},${JSON.stringify(revId)})'>⟲ Pulihkan ke Versi Ini</button>`:""}<div class="diffwrap">${r.content||"<p>Kosong.</p>"}</div>`;
 }catch(e){toast("Gagal memuat versi: "+(e.code||e.message))}
}
window.viewRevision=viewRevision;

async function compareRevisions(articleId,ridA,ridB){
 try{
  const [snapA,snapB]=await Promise.all([getDoc(doc(db,"articles",articleId,"revisions",ridA)),getDoc(doc(db,"articles",articleId,"revisions",ridB))]);
  if(!snapA.exists()||!snapB.exists())return toast("Versi tidak ditemukan");
  let ra=snapA.data(),rb=snapB.data();
  if(ra.version>rb.version)[ra,rb]=[rb,ra];
  const oldPlain=plain(ra.content||""),newPlain=plain(rb.content||"");
  document.getElementById("main").innerHTML=`<div class="crumb-container"><span class="crumb-item" onclick='window.openRevisions(${JSON.stringify(articleId)})'>← Kembali ke Riwayat Versi</span></div><h1>Perbandingan Versi ${ra.version} → Versi ${rb.version}</h1><p class="muted"><span class="diffdel">Teks Merah</span> = Dihapus, <span class="diffadd">Teks Hijau</span> = Ditambahkan.</p><div class="diffwrap">${diffWords(oldPlain,newPlain).replace(/\n/g,"<br>")}</div>`;
 }catch(e){toast("Gagal membandingkan: "+(e.code||e.message))}
}
window.compareRevisions=compareRevisions;

function restoreRevision(articleId,revId){
 showModal({
   title:"Pulihkan Versi Artikel",
   message:"Artikel akan dipulihkan ke versi lama ini. Sebuah versi baru akan dibuat berisi konten lama tersebut. Lanjutkan?",
   confirmText:"Ya, Pulihkan",
   onConfirm:async ()=>{
     try{
      const aRef=doc(db,"articles",articleId),aSnap=await getDoc(aRef);
      if(!aSnap.exists()||!canEditArticle({...aSnap.data(),id:articleId}))return toast("Tidak punya izin memulihkan artikel ini.");
      const rSnap=await getDoc(doc(db,"articles",articleId,"revisions",revId));
      if(!rSnap.exists())return toast("Versi tidak ditemukan");
      const r=rSnap.data(),newVersion=(aSnap.data().version||1)+1;
      await updateDoc(aRef,{title:r.title,category:r.category,tags:r.tags,desc:r.desc,content:r.content,version:newVersion,updatedAt:serverTimestamp()});
      await addDoc(collection(db,"articles",articleId,"revisions"),{version:newVersion,title:r.title,category:r.category,tags:r.tags,desc:r.desc,content:r.content,editedBy:user.uid,editedByName:user.displayName||"Kontributor",editedAt:serverTimestamp(),restoredFrom:r.version});
      toast("Artikel berhasil dipulihkan ke versi "+r.version);
      setTimeout(()=>window.renderArticleUI(articleId),400);
     }catch(e){console.error(e);toast("Gagal memulihkan: "+(e.code||e.message))}
   }
 });
}
window.restoreRevision=restoreRevision;
