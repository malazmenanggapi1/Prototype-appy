dth:34px;height:34px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}.file-card a{color:var(--accent);font-weight:750;text-decoration:none}.file-card small{display:block;color:var(--muted);margin-top:2px}.editor-shell{max-width:1000px;margin:auto}.editor-blocks{display:flex;flex-direction:column;gap:8px;margin-top:8px}.eblock{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px}.eblock:hover{border-color:var(--line-strong)}.eblock-head{display:flex;align-items:center;gap:7px;margin-bottom:7px}.eblock-type{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#858d98;font-weight:850;flex:1}.eblock-actions{display:flex;gap:3px}.eblock textarea,.eblock input{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--text);outline:0;padding:9px 10px}.eblock textarea{min-height:84px;resize:vertical;line-height:1.65}.eblock textarea:focus,.eblock input:focus{border-color:#b9b1e2;box-shadow:0 0 0 3px rgba(103,88,201,.07)}.eblock-preview{padding:11px;background:#f8f9fb;border:1px dashed var(--line-strong);border-radius:7px;font-size:11px;color:var(--muted)}.eblock-preview img,.eblock-preview video{max-width:100%;max-height:220px;display:block;margin:auto;border-radius:6px}.eblock-preview audio{width:100%}.block-tools{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0}.block-tools .tool{font-size:11px}.layout-panel{margin-top:12px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:9px}.layout-panel h3{margin:0 0 10px;font-size:13px}.layout-options{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.layout-option{padding:9px;border:1px solid var(--line);border-radius:7px;background:#fafbfc;cursor:pointer;font-size:11px}.layout-option.active{border-color:#b9b1e2;background:var(--accent-soft);color:var(--accent)}.group-editor{margin-top:10px}.group-row{display:grid;grid-template-columns:1fr auto;gap:7px;margin-bottom:7px}.child-group-row{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:7px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.child-group-row:first-child{border-top:0}.editor-media-note{font-size:10px;color:var(--muted);margin-top:6px;line-height:1.45}.article .content .block-heading{margin-top:31px}.article .content .block-text{max-width:790px}.article .content .block-quote{max-width:790px}.article-menu-empty{padding:8px 7px;color:var(--muted);font-size:10px}.media-add-label{display:inline-flex;align-items:center;gap:6px}.hidden-file{display:none!important}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
// Storage di-import secara dinamis (Lazy Loading) saat pengguna mengunggah file untuk menghemat bandwidth awal.
import {
  getFirestore, collection, addDoc, doc, getDoc, getDocs, updateDoc, deleteDoc,
  onSnapshot, query, where, orderBy, limit, serverTimestamp, deleteField
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDX-qfSxXMSHr5m3Kfp1qHyHgwiF1xB-Lo",
  authDomain:"first-prototype-wiki.firebaseapp.com",
  projectId:"first-prototype-wiki",
  storageBucket:"first-prototype-wiki.firebasestorage.app",
  messagingSenderId:"506146325520",
  appId:"1:506146325520:web:8266348a56eb9b3cae3695",
  measurementId:"G-E1XZ1F6X42"
};

const app=initializeApp(firebaseConfig);
try{getAnalytics(app)}catch(e){}
const auth=getAuth(app), db=getFirestore(app);
const provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:"select_account"});

let user=null, articles=[], spaces=[], editingId=null, editingSpacesId=null;

let rerenderCurrent=()=>home();
function parseHashArticleId(){const m=location.hash.match(/^#\/article\/(.+)$/);return m?decodeURIComponent(m[1]):null}
function findSpaces(id){return spaces.find(s=>s.id===id)||demoSpacess.find(s=>s.id===id)}
function spaceRole(space){
 if(!space||!user)return null;
 if(space.ownerId===user.uid)return "owner";
 return space.members?.[user.uid]||null;
}
function canCreateInSpaces(space){const r=spaceRole(space);return r==="owner"||r==="editor"||r==="contributor"}
function canManageSpaces(space){return spaceRole(space)==="owner"}
function canEditArticle(a){
 if(!user)return false;
 if(a.ownerId===user.uid||a.authorId===user.uid)return true;
 if(a.spaceId){const r=spaceRole(findSpaces(a.spaceId));if(r==="owner"||r==="editor")return true}
 return false;
}
function canDeleteArticle(a){return canEditArticle(a)}
function roleLabel(r){return {owner:"Owner",editor:"Editor",contributor:"Contributor",viewer:"Viewer"}[r]||"Viewer"}

// Authentication Handling
async function login() {
  try {
    await signInWithPopup(auth, provider);
    toast("Berhasil login!");
  } catch(e) {
    toast("Login gagal: " + (e.message || e));
  }
}

async function logout() {
  try {
    await signOut(auth);
    toast("Berhasil keluar");
    home();
  } catch(e) {
    toast("Logout gagal: " + (e.message || e));
  }
}

function updateAccountUI() {
  const acc = document.getElementById("account");

// Sync data Firestore secara terpisah dari render awal
function initDataSync() {
  try {
    onSnapshot(query(collection(db, "articles"), orderBy("updatedAt", "desc")), (snap) => {
      articles = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      rerenderCurrent();
    }, (err) => console.log("Firestore articles notice:", err.message));

    onSnapshot(query(collection(db, "spaces"), orderBy("updatedAt", "desc")), (snap) => {
      spaces = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      rerenderCurrent();
    }, (err) => console.log("Firestore spaces notice:", err.message));
  } catch(e) {
    console.error(e);
  }
}

function getBreadcrumbs(articleId){
 const all=[...articles,...demo];
 const trail=[];
 let curr=all.find(a=>a.id===articleId);
 const visited=new Set();
 while(curr && !visited.has(curr.id)){
   visited.add(curr.id);
   trail.unshift(curr);
   if(curr.parentId){
     curr=all.find(a=>a.id===curr.parentId);
   } else {
     break;
   }
 }
 return trail;
}

function renderTreeHTML(parentId=null, spaceId=null, currentArticleId=null, level=0, rootArticleId=null){
 const all=[...articles,...demo];
 let children;
 if(spaceId){
   children=all.filter(a=>{
     if(a.spaceId!==spaceId)return false;
     if(parentId===null)return !a.parentId;
     return a.parentId===parentId;
   });
 }else if(level===0){
   const root=all.find(a=>a.id===rootArticleId);
   children=root?[root]:[];
 }else{
   children=all.filter(a=>a.parentId===parentId && !a.spaceId);
 }
 if(!children.length)return "";
 return `<ul class="tree-list ${level>0?"nested":""}">`+children.map(child=>{
   const sub=renderTreeHTML(child.id, spaceId, currentArticleId, level+1, rootArticleId);
   const isActive=child.id===currentArticleId?"active":"";
   return `<li class="tree-item">
     <div class="tree-node ${isActive}" onclick='window.openArticle(${JSON.stringify(child.id)})'>
       <span class="tree-icon">${sub?"📂":"📄"}</span>
       <span>${esc(child.title)}</span>
     </div>
     ${sub}
   </li>`;
 }).join("")+`</ul>`;
}

function defaultBlocksFromArticle(a){
  if(Array.isArray(a?.blocks)&&a.blocks.length)return a.blocks.map(b=>({...b}));
  return htmlToBlocks(a?.content||"");
}
function htmlToBlocks(html){
  if(!html)return [{type:"text",text:"",marker:""}];
  const docx=new DOMParser().parseFromString(`<div>${html}</div>`,'text/html');
  const root=docx.body.firstElementChild, out=[];
  [...root.children].forEach(el=>{
    const tag=el.tagName.toLowerCase();
    if(tag==='h1'||tag==='h2'||tag==='h3'||tag==='h4')out.push({type:"heading",text:el.textContent||"",marker:""});
    else if(tag==='blockquote')out.push({type:"quote",text:el.textContent||"",marker:""});
    else if(tag==='img')out.push({type:"image",url:el.getAttribute('src')||"",caption:el.getAttribute('alt')||"",marker:""});
    else if(tag==='audio')out.push({type:"audio",url:el.getAttribute('src')||el.querySelector('source')?.getAttribute('src')||"",caption:"",marker:""});
    else if(tag==='video')out.push({type:"video",url:el.getAttribute('src')||el.querySelector('source')?.getAttribute('src')||"",caption:"",marker:""});
    else if(tag==='a'&&el.getAttribute('href'))out.push({type:"file",url:el.getAttribute('href'),name:el.textContent||"File",caption:"",marker:""});
    else out.push({type:"text",text:el.textContent||"",marker:""});
  });
  return out.length?out:[{type:"text",text:plain(html),marker:""}];
}
function blockLegacyHTML(b){
  const marker=b.marker?`<span data-atlasia-marker="${esc(b.marker)}"></span>`:"";
  if(b.type==='heading')return `${marker}<h2>${esc(b.text||"")}</h2>`;
  if(b.type==='quote')return `${marker}<blockquote>${esc(b.text||"")}</blockquote>`;
  if(b.type==='image')return `${marker}<figure><img class="article-image" src="${esc(b.url||"")}" alt="${esc(b.caption||"")}">${b.caption?`<figcaption>${esc(b.caption)}</figcaption>`:""}</figure>`;
  if(b.type==='audio')return `${marker}<div class="media-block"><audio controls src="${esc(b.url||"")}"></audio>${b.caption?`<div class="media-caption">${esc(b.caption)}</div>`:""}</div>`;
  if(b.type==='video')return `${marker}<div class="media-block"><video controls playsinline preload="metadata" src="${esc(b.url||"")}"></video>${b.caption?`<div class="media-caption">${esc(b.caption)}</div>`:""}</div>`;
  if(b.type==='file')return `${marker}<div class="media-block media-card"><div class="file-card"><div class="file-icon">📎</div><div><a href="${esc(b.url||"")}" target="_blank" rel="noopener">${esc(b.name||"Download file")}</a>${b.caption?`<small>${esc(b.caption)}</small>`:""}</div></div></div>`;
  return `${marker}<p>${esc(b.text||"").replace(/\n/g,"<br>").replace(/\*\*(.*?)\*\*/g,"<b>$1</b>").replace(/\*(.*?)\*/g,"<i>$1</i>")}</p>`;
}
function blocksToHTML(blocks){return (blocks||[]).map(blockLegacyHTML).join("")}
function markerEntries(blocks){return (blocks||[]).map((b,i)=>b.marker?{id:`marker-${i}`,label:b.marker,index:i}:null).filter(Boolean)}
function articleGroupsFor(a){return Array.isArray(a?.articleGroups)?a.articleGroups.map(g=>({name:g.name||"Group",articleIds:Array.isArray(g.articleIds)?g.articleIds:[...[]]})):[]}
function renderArticleMenu(a,all,treeHTML){

  return `<aside class="article-menu"><div class="article-menu-title">Article menu</div>${body}</aside>`;

async function uploadEditorMedia(block,i){
  if(!block.file)return block.url||"";
  const { getStorage, ref: storageRef, uploadBytes, getDownloadURL } = 
    await import("https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js");
  const storage = getStorage(app);
  const safe=(block.file.name||`media-${i}`).replace(/[^a-zA-Z0-9._-]+/g,"-").slice(-90);
  const path=`articles/${user.uid}/${Date.now()}-${crypto.randomUUID?.()||Math.random().toString(36).slice(2)}-${safe}`;
  const ref=storageRef(storage,path);await uploadBytes(ref,block.file,{contentType:block.file.type||"application/octet-stream"});return await getDownloadURL(ref);
}

 for(let i=a.length-1;i>=0;i--)for(let j=b.length-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 let i=0,j=0,out=[];
 while(i<a.length&&j<b.length){if(a[i]===b[j]){out.push(esc(a[i]));i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){out.push(`<span class="diffdel">${esc(a[i])}</span>`);i++}else{out.push(`<span class="diffadd">${esc(b[j])}</span>`);j++}}
 while(i<a.length){out.push(`<span class="diffdel">${esc(a[i])}</span>`);i++}while(j<b.length){out.push(`<span class="diffadd">${esc(b[j])}</span>`);j++}
 return out.join("");
}

async function openRevisions(articleId){
 const a=articles.find(x=>x.id===articleId);if(!a)return toast("Artikel tidak ditemukan");
 rerenderCurrent=()=>openRevisions(articleId);history.pushState(null,'',location.pathname+location.search);revCompareSelection=[];
 try{const q=query(collection(db,"articles",articleId,"revisions"),orderBy("version","desc"),limit(50)),snap=await getDocs(q);renderRevisionList(articleId,snap.docs.map(d=>({id:d.id,...d.data()})));}catch(e){toast("Gagal memuat riwayat: "+(e.code||e.message))}
}
window.openRevisions=openRevisions;

function renderRevisionList(articleId,revs){
 document.getElementById("main").innerHTML=`<div class="crumb-container"><span class="crumb-item" onclick='window.openArticle(${JSON.stringify(articleId)})'>← Back ke Artikel</span></div><h1>🕐 Riwayat Version</h1><p class="muted">Klik dua versi untuk membandingkan perubahan (Diff).</p><div class="box" style="padding:8px 20px" id="revlist">${revs.map(r=>`<div class="revrow" data-rid="${esc(r.id)}"><span class="v">Version ${r.version}</span><span class="muted" style="flex:1">${esc(r.editedByName||"")} · ${r.editedAt?.toDate?.()?.toLocaleString("id-ID")||"baru saja"}</span><button class="btn sm" onclick='event.stopPropagation();window.viewRevision(${JSON.stringify(articleId)},${JSON.stringify(r.id)})'>Lihat</button></div>`).join("")}</div><div id="revaction" style="margin-top:16px"></div>`;
 document.querySelectorAll("#revlist .revrow").forEach(row=>{
  row.addEventListener("click",()=>{
   const rid=row.dataset.rid,idx=revCompareSelection.indexOf(rid);
   if(idx>-1){revCompareSelection.splice(idx,1);row.classList.remove("selected")}
   else{if(revCompareSelection.length>=2){const first=revCompareSelection.shift();document.querySelector(`#revlist .revrow[data-rid="${first}"]`)?.classList.remove("selected")}revCompareSelection.push(rid);row.classList.add("selected")}
   const box=document.getElementById("revaction");
   if(revCompareSelection.length===2)box.innerHTML=`<button class="btn primary" onclick='window.compareRevisions(${JSON.stringify(articleId)},${JSON.stringify(revCompareSelection[0])},${JSON.stringify(revCompareSelection[1])})'>Bandingkan 2 Version Terpilih</button>`;else box.innerHTML="";
  });
 });
}

window.viewRevision=async(articleId,revId)=>{
 try{
  const snap=await getDoc(doc(db,"articles",articleId,"revisions",revId));if(!snap.exists())return toast("Tidak ditemukan");
  const r=snap.data(),a=articles.find(x=>x.id===articleId),isLatest=a && r.version===a.version;
  document.getElementById("main").innerHTML=`<div class="crumb-container"><span class="crumb-item" onclick='window.openRevisions(${JSON.stringify(articleId)})'>← Riwayat</span></div><h1>${esc(r.title)} <span class="badge">Version ${r.version}</span></h1><p class="muted">Diedit oleh ${esc(r.editedByName||"")} pada ${r.editedAt?.toDate?.()?.toLocaleString("id-ID")||""}</p>${!isLatest && a && canEditArticle(a)?`<button class="btn primary" style="margin-bottom:16px" onclick='window.restoreRevision(${JSON.stringify(articleId)},${JSON.stringify(revId)})'>⟲ Pulihkan</button>`:""}<div class="diffwrap">${r.content||"<p>Kosong.</p>"}</div>`;
 }catch(e){toast("Gagal: "+(e.code||e.message))}
};

window.compareRevisions=async(articleId,ridA,ridB)=>{
 try{
  const [snapA,snapB]=await Promise.all([getDoc(doc(db,"articles",articleId,"revisions",ridA)),getDoc(doc(db,"articles",articleId,"revisions",ridB))]);
  let ra=snapA.data(),rb=snapB.data();if(ra.version>rb.version)[ra,rb]=[rb,ra];
  document.getElementById("main").innerHTML=`<div class="crumb-container"><span class="crumb-item" onclick='window.openRevisions(${JSON.stringify(articleId)})'>← Back</span></div><h1>Perbandingan v${ra.version} → v${rb.version}</h1><p class="muted"><span class="diffdel">Merah</span> = Dihapus, <span class="diffadd">Hijau</span> = Ditambah.</p><div class="diffwrap">${diffWords(plain(ra.content||""),plain(rb.content||"")).replace(/\n/g,"<br>")}</div>`;
 }catch(e){toast("Gagal membandingkan: "+(e.code||e.message))}
};

window.restoreRevision=(articleId,revId)=>{
 showModal({title:"Pulihkan Version",message:"Akan dipulihkan ke versi lama ini. Lanjutkan?",confirmText:"Ya, Pulihkan",onConfirm:async ()=>{
  try{
   const aRef=doc(db,"articles",articleId),aSnap=await getDoc(aRef);if(!canEditArticle({...aSnap.data(),id:articleId}))return toast("Tidak punya izin.");
   const rSnap=await getDoc(doc(db,"articles",articleId,"revisions",revId)),r=rSnap.data(),newVersionon=(aSnap.data().version||1)+1;
   await updateDoc(aRef,{title:r.title,category:r.category,tags:r.tags,desc:r.desc,content:r.content,blocks:r.blocks||htmlToBlocks(r.content||""),articleGroups:r.articleGroups||[],layoutConfig:r.layoutConfig||{navPosition:"right",navMode:"tree",contentWidth:"normal"},version:newVersionon,updatedAt:serverTimestamp()});
   await addDoc(collection(db,"articles",articleId,"revisions"),{version:newVersionon,title:r.title,category:r.category,tags:r.tags,desc:r.desc,content:r.content,blocks:r.blocks||[],articleGroups:r.articleGroups||[],layoutConfig:r.layoutConfig||{},editedBy:user.uid,editedByName:user.displayName||"Contributor",editedAt:serverTimestamp(),restoredFrom:r.version});
   toast("Dipulihkan ke v"+r.version);setTimeout(()=>window.openArticle(articleId),400);
  }catch(e){toast("Gagal: "+(e.code||e.message))}
 }});
};
