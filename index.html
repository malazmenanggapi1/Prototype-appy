<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlasia — Modern Knowledge Platform</title>

<!-- Preconnect & Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Preconnect Firebase/Supabase -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

<!-- Lucide Icons CDN -->
<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root {
  --bg: #f8fafc;
  --sidebar: #f1f5f9;
  --surface: #ffffff;
  --surface-hover: #f8fafc;
  --text: #0f172a;
  --muted: #64748b;
  --faint: #94a3b8;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --accent-soft: #eef2ff;
  --accent-border: #c7d2fe;
  --success: #10b981;
  --danger: #ef4444;
  --danger-soft: #fef2f2;
  
  --sidebar-w: 250px;
  --content: 1140px;
  --reading-w: 740px;
  
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
}

* { box-sizing: border-box; }
html { background: var(--bg); color-scheme: light; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; }

/* SVG Icon Helper Styles */
.lucide, [data-lucide] {
  width: 18px;
  height: 18px;
  stroke-width: 2.2px;
  display: inline-block;
  vertical-align: middle;
  flex-shrink: 0;
}

/* Header & Navigasi Atas */
.top {
  height: 62px;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

.logo {
  min-width: calc(var(--sidebar-w) - 24px);
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.6px;
  color: var(--accent);
  cursor: pointer;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo span { color: var(--text); }
.logo-icon {
  width: 24px;
  height: 24px;
  color: var(--accent);
}

.search {
  flex: 1;
  max-width: 540px;
  position: relative;
  display: flex;
  align-items: center;
}
.search-icon-wrapper {
  position: absolute;
  left: 14px;
  color: var(--muted);
  display: flex;
  align-items: center;
  pointer-events: none;
}
.search input {
  width: 100%;
  height: 40px;
  padding: 0 72px 0 42px;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  background: #edf2f7;
  color: var(--text);
  font-size: 13.5px;
  font-weight: 500;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.search input:focus {
  background: #ffffff;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
  outline: none;
}
.search-shortcut {
  position: absolute;
  right: 10px;
  display: inline-flex;
  align-items: center;
  padding: 3px 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  background: #ffffff;
  border: 1px solid var(--line);
  border-radius: 6px;
  pointer-events: none;
  box-shadow: var(--shadow-sm);
}

.actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: #ffffff;
  color: #334155;
  font-size: 13px;
  font-weight: 600;
  min-height: 38px;
  transition: all 0.15s ease;
  box-shadow: var(--shadow-sm);
}
.btn:hover { background: #f8fafc; border-color: var(--line-strong); transform: translateY(-1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #ffffff; box-shadow: 0 2px 8px rgba(99, 102, 241, 0.25); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #ffffff; }
.btn.danger:hover { background: #dc2626; }
.btn.sm { padding: 4px 10px; font-size: 11.5px; min-height: 30px; border-radius: 6px; }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.user {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 10px 4px 4px;
  border: 1px solid var(--line);
  border-radius: 20px;
  background: #ffffff;
  cursor: pointer;
  transition: all 0.15s ease;
}
.user:hover { border-color: var(--accent-border); background: var(--accent-soft); }
.user img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
.user span { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 600; }

/* Layout Grid & Sidebar */
.layout {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  max-width: 1480px;
  margin: auto;
}
.side {
  height: calc(100vh - 62px);
  position: sticky;
  top: 62px;
  overflow-y: auto;
  padding: 20px 14px;
  background: var(--sidebar);
  border-right: 1px solid var(--line);
}
.navtitle {
  margin: 18px 10px 8px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.nav {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  margin: 3px 0;
  border-radius: var(--radius-md);
  color: #475569;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.nav:hover { background: #e2e8f0; color: var(--text); }
.nav.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.nav.active .lucide { color: var(--accent); }

.main {
  min-width: 0;
  width: 100%;
  max-width: calc(var(--content) + 40px);
  padding: 32px 36px 80px;
  margin: 0 auto;
}

/* Tipografi & Hero */
h1, h2, h3, h4 { color: var(--text); margin-top: 0; font-weight: 700; letter-spacing: -0.02em; }
.muted { color: var(--muted); }
.hero {
  padding: 38px 36px;
  background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md);
}
.hero h1 { margin: 0 0 12px; font-size: 34px; line-height: 1.18; font-weight: 800; letter-spacing: -0.03em; }
.hero p { max-width: 720px; margin: 0 0 22px; color: #475569; line-height: 1.65; font-size: 15px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
.stat { padding: 16px 20px; background: #ffffff; border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
.stat b { font-size: 22px; font-weight: 800; color: var(--text); }
.stat small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; font-weight: 500; }

.section { margin-top: 36px; }
.sectionhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.section h2 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }

/* Grid Kartu */
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.card {
  display: flex;
  flex-direction: column;
  min-height: 155px;
  padding: 20px;
  background: #ffffff;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.card:hover {
  transform: translateY(-3px);
  border-color: var(--accent-border);
  box-shadow: var(--shadow-lg);
}
.card-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.card .icon-box {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  border-radius: var(--radius-sm);
  color: var(--accent);
}
.card h3 { font-size: 15.5px; margin: 4px 0 6px; line-height: 1.35; font-weight: 700; }
.card p { margin: 0; flex: 1; color: var(--muted); font-size: 12.5px; line-height: 1.55; }
.card-tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px; }
.meta { margin-top: 14px; color: var(--faint); font-size: 11.5px; display: flex; gap: 10px; align-items: center; }
.meta span { display: inline-flex; align-items: center; gap: 4px; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 6px; background: #f1f5f9; color: #475569; font-size: 10.5px; font-weight: 600; }

.carousel {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding-bottom: 12px;
  -webkit-overflow-scrolling: touch;
}
.carousel .card { min-width: 260px; max-width: 260px; scroll-snap-align: start; flex: 0 0 auto; }

/* Layout Artikel Detail */
.crumb-container { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; color: var(--muted); font-size: 12px; font-weight: 500; }
.crumb-item { color: var(--accent); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
.crumb-item:hover { text-decoration: underline; }
.crumb-sep { color: var(--faint); }
.article { width: 100%; max-width: var(--content); margin: auto; }
.article h1 { margin: 0 0 10px; font-size: 34px; line-height: 1.18; letter-spacing: -0.03em; font-weight: 800; }
.lead { max-width: var(--reading-w); margin: 0 0 20px; color: var(--muted); font-size: 16px; line-height: 1.6; }
.articlegrid { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 28px; margin-top: 24px; }

/* Focus Mode Typography */
.content {
  min-width: 0;
  max-width: var(--reading-w);
  color: #334155;
  font-size: 16px;
  line-height: 1.75;
  word-break: break-word;
}
.content p { margin: 0 0 20px; }
.content h2 {
  margin: 40px 0 14px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text);
}
.content h3 { margin: 28px 0 10px; font-size: 18px; font-weight: 700; color: var(--text); }
.content blockquote {
  margin: 24px 0;
  padding: 14px 20px;
  border-left: 4px solid var(--accent);
  background: var(--accent-soft);
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
  color: #3730a3;
  font-size: 15.5px;
  line-height: 1.6;
}
.content pre {
  background: #0f172a;
  color: #f8fafc;
  padding: 18px;
  border-radius: var(--radius-md);
  overflow-x: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13.5px;
  line-height: 1.6;
  margin: 20px 0;
}
.content table { width: 100%; border-collapse: collapse; margin: 20px 0; display: block; overflow-x: auto; }
.content th, .content td { border: 1px solid var(--line); padding: 10px 14px; font-size: 14px; }
.content th { background: #f8fafc; font-weight: 700; }

.info { position: sticky; top: 82px; padding: 20px; background: #ffffff; border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
.info h3 { margin: 0 0 12px; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 800; }
.row { padding: 8px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
.row b { color: var(--muted); font-size: 10.5px; text-transform: uppercase; }

/* Hierarki Tree & Subpages */
.tree-card { padding: 16px; margin-bottom: 20px; background: #ffffff; border: 1px solid var(--line); border-radius: var(--radius-md); max-height: 500px; overflow-y: auto; box-shadow: var(--shadow-sm); }
.tree-list { list-style: none; padding: 0; margin: 0; }
.tree-list.nested { margin-left: 10px; padding-left: 14px; border-left: 1px solid var(--line); }
.tree-node {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  margin: 2px 0;
  border-radius: 6px;
  color: #475569;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.tree-node:hover { background: #f1f5f9; color: var(--text); }
.tree-node.active { background: var(--accent-soft); color: var(--accent); font-weight: 700; }

.subpages-box { margin-top: 36px; padding: 22px; background: #ffffff; border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
.subpages-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.subpages-header h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.subpages-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.subpage-card { padding: 14px; background: #f8fafc; border: 1px solid var(--line); border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s ease; }
.subpage-card:hover { background: #ffffff; border-color: var(--accent-border); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.subpage-card h4 { margin: 0 0 4px; font-size: 13.5px; color: var(--accent); display: flex; align-items: center; gap: 6px; }
.subpage-card p { margin: 0; color: var(--muted); font-size: 11.5px; }

/* Layout Fleksibel */
.article-layout { display: grid; gap: 28px; align-items: start; margin-top: 20px; }
.article-layout.nav-left { grid-template-columns: 240px minmax(0, 1fr); }
.article-layout.nav-right { grid-template-columns: minmax(0, 1fr) 240px; }
.article-layout.nav-top, .article-layout.nav-none { display: block; }
.article-menu {
  position: sticky;
  top: 82px;
  max-height: calc(100vh - 100px);
  overflow-y: auto;
  background: #ffffff;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}
.nav-top .article-menu { position: static; margin-bottom: 24px; }
.article-menu-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 800; color: var(--muted); margin: 2px 4px 10px; }
.article-menu-section { margin-top: 16px; }
.article-menu-section:first-of-type { margin-top: 0; }
.article-menu-link {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 7px 9px;
  border-radius: 6px;
  color: #475569;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  line-height: 1.4;
  transition: all 0.12s ease;
}
.article-menu-link:hover { background: #f1f5f9; color: var(--text); }
.marker-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: 0 0 auto; }

/* Media Card */
.content img.article-image { display: block; max-width: 100%; height: auto; border-radius: var(--radius-md); border: 1px solid var(--line); margin: 20px 0; box-shadow: var(--shadow-sm); }
.media-block { margin: 20px 0; max-width: 100%; }
.media-block video { display: block; width: 100%; max-width: 100%; max-height: 480px; object-fit: contain; background: #0f172a; border-radius: var(--radius-md); }
.media-block audio { display: block; width: 100%; }
.media-card { border: 1px solid var(--line); border-radius: var(--radius-md); background: #ffffff; overflow: hidden; box-shadow: var(--shadow-sm); }
.media-card img, .media-card video { display: block; width: 100%; max-height: 480px; object-fit: contain; background: #0f172a; }
.media-card audio { display: block; width: 100%; padding: 12px; }
.media-caption { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); background: #f8fafc; }
.file-card { display: flex; align-items: center; gap: 14px; padding: 14px; }
.file-card .file-icon { width: 40px; height: 40px; border-radius: var(--radius-sm); background: var(--accent-soft); display: grid; place-items: center; color: var(--accent); }
.file-card a { color: var(--accent); font-weight: 700; text-decoration: none; }
.file-card a:hover { text-decoration: underline; }
.file-card small { display: block; color: var(--muted); margin-top: 2px; font-weight: 400; }

/* Editor Form */
.editor-shell { max-width: 960px; margin: auto; }
.editor-blocks { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
.eblock { background: #ffffff; border: 1px solid var(--line); border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-sm); }
.eblock:hover { border-color: var(--line-strong); }
.eblock-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.eblock-type { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 800; flex: 1; }
.eblock-actions { display: flex; gap: 6px; }
.eblock textarea, .eblock input, .field {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: #ffffff;
  color: var(--text);
  outline: 0;
  padding: 9px 13px;
  font-size: 13.5px;
  transition: all 0.15s ease;
}
.eblock textarea { min-height: 90px; resize: vertical; line-height: 1.6; }
.eblock textarea:focus, .eblock input:focus, .field:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
}
.eblock-preview { padding: 12px; background: #f8fafc; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); font-size: 12px; color: var(--muted); margin-top: 8px; }
.eblock-preview img, .eblock-preview video { max-width: 100%; max-height: 240px; display: block; margin: auto; border-radius: 8px; }
.eblock-preview audio { width: 100%; }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px; background: #ffffff; border: 1px solid var(--line); border-bottom: 0; border-radius: var(--radius-md) var(--radius-md) 0 0; margin-top: 16px; }
.tool { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: #f8fafc; color: #475569; font-weight: 600; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
.tool:hover { background: #e2e8f0; color: var(--text); }
.title { width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 30px; font-weight: 800; padding: 6px 0 14px; letter-spacing: -0.02em; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.editorbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; flex-wrap: wrap; }

/* Panel Layout & Group */
.layout-panel { margin-top: 16px; padding: 18px; background: #ffffff; border: 1px solid var(--line); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
.layout-panel h3 { margin: 0 0 12px; font-size: 14px; }
.layout-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.layout-option { padding: 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: #f8fafc; cursor: pointer; font-size: 12px; text-align: center; font-weight: 500; transition: all 0.15s ease; }
.layout-option.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.group-editor { margin-top: 14px; }
.group-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-bottom: 8px; }
.child-group-row { display: grid; grid-template-columns: minmax(0, 1fr) 160px; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }

/* Explore & Kategori */
.explore { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.cat { padding: 18px; background: #ffffff; border: 1px solid var(--line); border-radius: var(--radius-md); cursor: pointer; box-shadow: var(--shadow-sm); transition: all 0.15s ease; }
.cat:hover { background: #ffffff; border-color: var(--accent-border); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.cat .icon { color: var(--accent); margin-bottom: 8px; display: block; }
.cat b { display: block; font-size: 14px; font-weight: 700; }
.cat small { display: block; margin-top: 3px; color: var(--muted); font-size: 11.5px; }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); background: #ffffff; border: 1px dashed var(--line-strong); border-radius: var(--radius-md); }

/* Badge & Member Rows */

// ===== Optimized loading layer: load only what the current page needs =====
// ===== FIRESTORE QUOTA OPTIMIZATION =====
// Cache ringan untuk daftar publik. Menghindari read berulang saat pengguna
// berpindah halaman dalam sesi yang sama.
const FIRESTORE_CACHE_PREFIX = "atlasia_fs_cache_v1:";
const CACHE_TTL = { home: 2*60*1000, popular: 5*60*1000, article: 10*60*1000, spaces: 5*60*1000 };
function readCache(key, ttl){
  try { const raw=localStorage.getItem(FIRESTORE_CACHE_PREFIX+key); if(!raw) return null;
    const data=JSON.parse(raw); if(!data || Date.now()-data.time>ttl){ localStorage.removeItem(FIRESTORE_CACHE_PREFIX+key); return null; }
    return data.value;
  } catch(e){ return null; }
}
function writeCache(key,value){ try{ localStorage.setItem(FIRESTORE_CACHE_PREFIX+key,JSON.stringify({time:Date.now(),value})); }catch(e){} }
function normalizeCached(items){ return (items||[]).map(a=>({...a,updatedAt:a.updatedAt||null,createdAt:a.createdAt||null})); }
async function cachedQuery(key, ttl, loader){
  const cached=readCache(key,ttl); if(cached) return normalizeCached(cached);
  const value=await loader(); writeCache(key,value); return value;
}
function invalidateCache(prefix=""){
  try{ Object.keys(localStorage).filter(k=>k.startsWith(FIRESTORE_CACHE_PREFIX+prefix)).forEach(k=>localStorage.removeItem(k)); }catch(e){}
}
// =========================================
const ARTICLE_PAGE_SIZE = 12;
let exploreCursor = null;
let exploreHasMore = true;
let exploreLoading = false;
let articleCache = new Map();

function cacheArticles(items){
  items.forEach(a=>articleCache.set(a.id,a));
  articles = [...articleCache.values()].sort((a,b)=>(b.updatedAt?.toMillis?.()||0)-(a.updatedAt?.toMillis?.()||0));
}
async function fetchArticlesPage(cursor=null, pageSize=ARTICLE_PAGE_SIZE){
  let q=query(collection(db,"articles"),orderBy("updatedAt","desc"),limit(pageSize));
  if(cursor) q=query(collection(db,"articles"),orderBy("updatedAt","desc"),startAfter(cursor),limit(pageSize));
  const snap=await getDocs(q);
  const items=snap.docs.map(d=>({id:d.id,...d.data()}));
  cacheArticles(items);
  return {items,cursor:snap.docs.at(-1)||null,hasMore:snap.docs.length===pageSize};
}
async function ensureArticle(id){
  if(articleCache.has(id)) return articleCache.get(id);
  const cached=readCache("article:"+id,CACHE_TTL.article);
  if(cached){ cacheArticles([cached]); return cached; }
  const snap=await getDoc(doc(db,"articles",id));
  if(!snap.exists()) return null;
  const a={id:snap.id,...snap.data()}; cacheArticles([a]); writeCache("article:"+id,a); return a;
}

async function explore(reset=true){

  exploreLoading=false; refreshUI();
}

async function filterCat(cat){

  refreshUI();

function parseHashArticleId(){
  const m=location.hash.match(/^#\/article\/(.+)$/);
  return m?decodeURIComponent(m[1]):null;
}

function findSpaces(id){ return spaces.find(s=>s.id===id)||null }

function spaceRole(space){
  if(!space||!user)return null;
  if(space.ownerId===user.uid)return "owner";
  return space.members?.[user.uid]||null;
}
function canCreateInSpaces(space){ const r=spaceRole(space); return r==="owner"||r==="editor"||r==="contributor" }
function canManageSpaces(space){ return spaceRole(space)==="owner" }

// Hak Akses (Termasuk Administrator)
function canEditArticle(a){
  if(!user) return false;
  if(isAdmin) return true; // Administrator dapat mengedit seluruh artikel
  if(a.ownerId===user.uid||a.authorId===user.uid) return true;
  if(a.spaceId){const r=spaceRole(findSpaces(a.spaceId));if(r==="owner"||r==="editor")return true}
  return false;
}
function canDeleteArticle(a){
  if(!user) return false;
  if(isAdmin) return true; // Administrator dapat menghapus artikel apa saja
  return canEditArticle(a);
}
function canAddSubpage(a){
  if(!user||!a) return false;
  if(isAdmin) return true;
  if(a.ownerId===user.uid||a.authorId===user.uid) return true;
  if(a.spaceId) return canCreateInSpaces(findSpaces(a.spaceId));
  return false;
}

function randomPicks(arr,n){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a.slice(0,n);
}

async function incrementViews(a){
  if(viewedThisSession.has(a.id)) return;
  viewedThisSession.add(a.id);

  a.views = (a.views || 0) + 1;
  const viewEl = document.getElementById(`vcount-${a.id}`);
  if(viewEl) viewEl.textContent = Number(a.views).toLocaleString();
  const pageViewEl = document.getElementById("articleViewsDisplay");
  if(pageViewEl) pageViewEl.textContent = Number(a.views).toLocaleString();

  try{
    const ref = doc(db, "articles", a.id);
    // Satu write tanpa getDoc tambahan. Session guard mencegah refresh berulang.
    await updateDoc(ref, { views: increment(1) });
    invalidateCache("home:");
    invalidateCache("article:"+a.id);
  }catch(e){
    console.warn("Gagal sinkron views ke cloud:", e);
  }
}

const RECENT_KEY="atlasia_recent_v1";

    let list=JSON.parse(localStorage.getItem(RECENT_KEY)||"[]");

    localStorage.setItem(RECENT_KEY,JSON.stringify(list));
  }catch(e){}
}

  const all=[...articles], items=ids.map(id=>all.find(a=>a.id===id)).filter(Boolean);

}

async function toggleSaved(id){
  if(!user) return login();
  try{
    const ref=doc(db,"users",user.uid);
    const snap=await getDoc(ref);
    const cur=snap.exists()&&Array.isArray(snap.data().savedArticles)?snap.data().savedArticles:[];
    const has=cur.includes(id);
    const next=has?cur.filter(x=>x!==id):[...cur,id];
    await setDoc(ref,{uid:user.uid,savedArticles:next},{merge:true});
    mySaved=next;
    toast(has?"Dihapus dari Saved":"Tersimpan ke daftar Saved");
    const saveBtn = document.getElementById("btnSavedArticle");
    if(saveBtn) saveBtn.innerHTML = has ? `<i data-lucide="bookmark"></i> Simpan` : `<i data-lucide="bookmark-check"></i> Tersimpan`;
    refreshUI();
    if(document.getElementById("nav-saved")?.classList.contains("active")) saved();
  }catch(e){ toast("Gagal: "+e.message) }
}

function saved(){
  history.pushState(null,'',location.pathname+"#/saved");
  setNav("saved");
  if(!user){
    document.getElementById("main").innerHTML=`<h1>Saved</h1><div class="empty">Masuk dengan akun Google untuk melihat koleksi tersimpanmu.</div>`;
    refreshUI();
    return;
  }
  const all=[...articles], items=mySaved.map(id=>all.find(a=>a.id===id)).filter(Boolean);
  document.getElementById("main").innerHTML=`<h1>Saved Articles</h1><p class="muted">Koleksi artikel yang kamu tandai.</p>${items.length?`<div class="cards">${items.map(card).join("")}</div>`:'<div class="empty">Belum ada artikel tersimpan. Buka artikel lalu klik "Simpan".</div>'}`;
  refreshUI();
}

function makeSlug(text){
  return (text||"").toLowerCase().trim().replace(/[^\w\s-]/g,"").replace(/[\s_-]+/g,"-").replace(/^-+|-+$/g,"")||"artikel";
}

async function generateUniqueSlug(baseSlug){
  let slug=baseSlug,i=2;
  while((await getDoc(doc(db,"articles",slug))).exists()){ slug=`${baseSlug}-${i}`; i++; }
  return slug;
}

async function getOrAssignUserId(currentUser){
  const userRef=doc(db,"users",currentUser.uid), counterRef=doc(db,"counters","users");
  return await runTransaction(db, async (tx)=>{
    const userSnap=await tx.get(userRef);
    if(userSnap.exists()&&userSnap.data().userId) return userSnap.data().userId;
    const counterSnap=await tx.get(counterRef);
    const next=(counterSnap.exists()?(counterSnap.data().count||0):0)+1;
    const padded=String(next).padStart(5,"0");
    tx.set(counterRef,{count:next},{merge:true});
    tx.set(userRef,{uid:currentUser.uid,userId:padded,displayName:currentUser.displayName||"Pengguna",displayNameLower:(currentUser.displayName||"Pengguna").toLowerCase(),photoURL:currentUser.photoURL||"",lastLogin:serverTimestamp()},{merge:true});
    return padded;
  });
}

function roleLabel(r){ return {owner:"Owner",editor:"Editor",contributor:"Contributor",viewer:"Viewer"}[r]||"Viewer" }

function getBreadcrumbs(articleId){
  const all=[...articles];
  const trail=[];
  let curr=all.find(a=>a.id===articleId);
  const visited=new Set();
  while(curr && !visited.has(curr.id)){
    visited.add(curr.id);
    trail.unshift(curr);
    if(curr.parentId) curr=all.find(a=>a.id===curr.parentId);
    else break;
  }
  return trail;
}

function renderTreeHTML(parentId=null, spaceId=null, currentArticleId=null, level=0, rootArticleId=null){
  const all=[...articles];
  let children;
  if(spaceId){
    children=all.filter(a=>{
      if(a.spaceId!==spaceId)return false;
      if(parentId===null)return !a.parentId;
      return a.parentId===parentId;
    });
  }else if(level===0){
    const root=all.find(a=>a.id===rootArticleId);
    children=root?[root]:[];
  }else{
    children=all.filter(a=>a.parentId===parentId && !a.spaceId);
  }
  if(!children.length)return "";
  return `<ul class="tree-list ${level>0?"nested":""}">`+children.map(child=>{
    const sub=renderTreeHTML(child.id, spaceId, currentArticleId, level+1, rootArticleId);
    const isActive=child.id===currentArticleId?"active":"";
    const iconName = sub ? "folder" : "file-text";
    return `<li class="tree-item">
      <div class="tree-node ${isActive}" onclick='window.openArticle(${JSON.stringify(child.id)})'>
        <i data-lucide="${iconName}"></i>
        <span>${esc(child.title)}</span>
      </div>
      ${sub}
    </li>`;
  }).join("")+`</ul>`;
}

function plain(html){ return (html||"").replace(/<h2>(.*?)<\/h2>/gi,"## $1\n\n").replace(/<blockquote>(.*?)<\/blockquote>/gi,"> $1\n\n").replace(/<p>(.*?)<\/p>/gi,"$1\n\n").replace(/<[^>]+>/g,"").trim() }

function htmlToBlocks(html){
  if(!html)return [{type:"text",text:"",marker:""}];
  const docx=new DOMParser().parseFromString(`<div>${html}</div>`,'text/html');
  const root=docx.body.firstElementChild, out=[];
  [...root.children].forEach(el=>{
    const tag=el.tagName.toLowerCase();
    if(tag==='h1'||tag==='h2'||tag==='h3'||tag==='h4') out.push({type:"heading",text:el.textContent||"",marker:""});
    else if(tag==='blockquote') out.push({type:"quote",text:el.textContent||"",marker:""});
    else if(tag==='img') out.push({type:"image",url:el.getAttribute('src')||"",caption:el.getAttribute('alt')||"",marker:""});
    else if(tag==='audio') out.push({type:"audio",url:el.getAttribute('src')||el.querySelector('source')?.getAttribute('src')||"",caption:"",marker:""});
    else if(tag==='video') out.push({type:"video",url:el.getAttribute('src')||el.querySelector('source')?.getAttribute('src')||"",caption:"",marker:""});
    else if(tag==='a'&&el.getAttribute('href')) out.push({type:"file",url:el.getAttribute('href'),name:el.textContent||"File",caption:"",marker:""});
    else out.push({type:"text",text:el.textContent||"",marker:""});
  });
  return out.length?out:[{type:"text",text:plain(html),marker:""}];
}

function blockLegacyHTML(b){
  const marker=b.marker?`<span data-atlasia-marker="${esc(b.marker)}"></span>`:"";
  if(b.type==='heading')return `${marker}<h2>${esc(b.text||"")}</h2>`;
  if(b.type==='quote')return `${marker}<blockquote>${esc(b.text||"")}</blockquote>`;
  if(b.type==='image')return `${marker}<figure><img class="article-image" src="${esc(safeUrl(b.url))}" alt="${esc(b.caption||"")}">${b.caption?`<figcaption class="muted" style="font-size:12px;text-align:center;margin-top:6px">${esc(b.caption)}</figcaption>`:""}</figure>`;
  if(b.type==='audio')return `${marker}<div class="media-block"><audio controls src="${esc(safeUrl(b.url))}"></audio>${b.caption?`<div class="media-caption">${esc(b.caption)}</div>`:""}</div>`;
  if(b.type==='video')return `${marker}<div class="media-block"><video controls playsinline preload="metadata" src="${esc(safeUrl(b.url))}"></video>${b.caption?`<div class="media-caption">${esc(b.caption)}</div>`:""}</div>`;
  if(b.type==='file')return `${marker}<div class="media-block media-card"><div class="file-card"><div class="file-icon"><i data-lucide="paperclip"></i></div><div><a href="${esc(safeUrl(b.url))}" target="_blank" rel="noopener">${esc(b.name||"Unduh Berkas")}</a>${b.caption?`<small>${esc(b.caption)}</small>`:""}</div></div></div>`;
  return `${marker}<p>${esc(b.text||"").replace(/\n/g,"<br>").replace(/\*\*(.*?)\*\*/g,"<b>$1</b>").replace(/\*(.*?)\*/g,"<i>$1</i>")}</p>`;
}

function blocksToHTML(blocks){ return (blocks||[]).map(blockLegacyHTML).join("") }
function markerEntries(blocks){ return (blocks||[]).map((b,i)=>b.marker?{id:`marker-${i}`,label:b.marker,index:i}:null).filter(Boolean) }
function articleGroupsFor(a){ return Array.isArray(a?.articleGroups)?a.articleGroups.map(g=>({name:g.name||"Group",articleIds:Array.isArray(g.articleIds)?g.articleIds:[]})) : [] }

function renderArticleMenu(a,all,treeHTML){
  const cfg={navMode:"tree",...(a.layoutConfig||{})}, markers=markerEntries(a.blocks||[]), groups=articleGroupsFor(a);
  let body="";
  if(cfg.navMode!=='markers') body+=`<div class="article-menu-section"><div class="article-menu-title">Struktur Halaman</div>${treeHTML||'<div class="muted" style="font-size:11px;padding:4px">Tidak ada hierarki pohon.</div>'}</div>`;
  if(cfg.navMode!=='tree') body+=`<div class="article-menu-section"><div class="article-menu-title">Navigasi Bagian</div>${markers.length?markers.map(m=>`<div class="article-menu-link" onclick='window.scrollToBlock(${m.index})'><span class="marker-dot"></span><span>${esc(m.label)}</span></div>`).join(""):'<div class="muted" style="font-size:11px;padding:4px">Belum ada penanda.</div>'}</div>`;
  if(cfg.navMode==='groups'||groups.length) body+=`<div class="article-menu-section"><div class="article-menu-title">Grup Dokumen</div>${groups.length?groups.map(g=>`<div style="font-size:10px;font-weight:800;color:var(--muted);margin:8px 4px 4px">${esc(g.name)}</div>${g.articleIds.map(id=>all.find(x=>x.id===id)).filter(Boolean).map(x=>`<div class="article-menu-link" onclick='window.openArticle(${JSON.stringify(x.id)})'><i data-lucide="file-text"></i> <span>${esc(x.title)}</span></div>`).join("")}`).join(""):'<div class="muted" style="font-size:11px;padding:4px">Belum ada grup.</div>'}</div>`;
  return `<aside class="article-menu"><div class="article-menu-title">Daftar Isi</div>${body}</aside>`;
}

function scrollToBlock(i){
  const el = document.getElementById(`block-${i}`);
  if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
}

function renderContentBlocks(a){
  const blocks=Array.isArray(a.blocks)&&a.blocks.length?a.blocks:htmlToBlocks(a.content||"");
  return blocks.map((b,i)=>`<div class="content-block" id="block-${i}" style="scroll-margin-top:82px">${blockLegacyHTML(b)}</div>`).join("");
}

  const existingModal = document.getElementById("reportModalOverlay");
  if (existingModal) existingModal.remove();

  const modal = document.createElement("div");
  modal.className = "modal-overlay";
  modal.id = "reportModalOverlay";
  modal.innerHTML = `
    <div class="modal-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div class="icon-box" style="width:36px;height:36px;display:grid;place-items:center;background:#fee2e2;border-radius:8px;color:#ef4444">
          <i data-lucide="flag"></i>
        </div>

      </div>

        <option value="Ujaran Kebencian / SARA / Pelecehan">Ujaran Kebencian / SARA / Pelecehan</option>

      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--text)">Keterangan Tambahan (Opsional):</label>
      <textarea id="reportNotesInput" class="field" style="min-height:80px;resize:vertical;font-size:13px" placeholder="Jelaskan bagian mana atau konteks pelanggarannya..."></textarea>

      <div class="modal-actions">
        <button class="btn" id="btnCancelReport">Batal</button>

      </div>

  `;

}

async function submitReport(articleId, articleTitle) {
  const btn = document.getElementById("btnConfirmReport");
  const reason = document.getElementById("reportReasonSelect")?.value;
  const notes = document.getElementById("reportNotesInput")?.value.trim() || "";

  if (!reason) return toast("Pilih alasan pelaporan.");
  if (btn) {
    btn.disabled = true;
    btn.textContent = "Mengirim...";
  }

  try {
    const reportData = {
      articleId,
      articleTitle,
      reason,
      notes,
      reporterUid: user.uid,
      reporterName: user.displayName || "Pengguna",
      reporterEmail: user.email || "",
      status: "pending",
      createdAt: serverTimestamp()
    };

    await addDoc(collection(db, "reports"), reportData);

    const modal = document.getElementById("reportModalOverlay");
    if (modal) modal.remove();

    toast("Laporan telah dikirim ke Tim Moderator. Terima kasih.");
  } catch (e) {
    toast("Gagal mengirim laporan: " + e.message);
    if (btn) {
      btn.disabled = false;
      btn.textContent = "Kirim Laporan";
    }
  }
}

async function openRevisions(articleId) {
  try {
    const revsSnap = await getDocs(collection(db, "articles", articleId, "revisions"));
    const revs = revsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!revs.length) return toast("Belum ada catatan riwayat revisi.");

    showModal({
      title: "Riwayat Versi Artikel",
      message: `Artikel ini tercatat memiliki ${revs.length} revisi di server database.`,
      confirmText: "Tutup",
      cancelText: "Batal"
    });
  } catch (e) {
    toast("Gagal mengambil riwayat: " + e.message);
  }
}

function editorBlockLabel(t){ return ({text:"Text",heading:"Heading",quote:"Quote",image:"Image",audio:"Audio",video:"Video",file:"File"}[t]||t) }

    return `<div class="eblock">
      <div class="eblock-head"><span class="eblock-type">${editorBlockLabel(b.type)}</span>${controls}</div>
      ${marker}${preview}
      <label class="btn sm" style="margin-top:8px;cursor:pointer"><i data-lucide="upload"></i> Pilih ${editorBlockLabel(b.type)}

function addEditorBlock(type){ editorBlocks.push({type,text:"",marker:"",caption:""}); renderEditorBlocks(); }
function updateBlock(i,k,v){ if(editorBlocks[i]) editorBlocks[i][k]=v; }
function removeEditorBlock(i){
  if(editorBlocks[i]?.preview) URL.revokeObjectURL(editorBlocks[i].preview);
  editorBlocks.splice(i,1);
  renderEditorBlocks();
}
function moveEditorBlock(i,d){
  const j=i+d;
  if(j<0||j>=editorBlocks.length)return;
  [editorBlocks[i],editorBlocks[j]]=[editorBlocks[j],editorBlocks[i]];
  renderEditorBlocks();
}

const MAX_FILE_SIZE={image:8*1024*1024,audio:25*1024*1024,video:60*1024*1024,file:25*1024*1024};
function validateMediaFile(type,f){
  if(!f)return "Berkas tidak ditemukan.";
  const max=MAX_FILE_SIZE[type]||MAX_FILE_SIZE.file;
  if(f.size>max)return `Ukuran file melampaui ${(max/1024/1024).toFixed(0)}MB.`;
  if(type==="image"&&!/^image\//.test(f.type))return "Format harus berupa gambar.";
  if(type==="audio"&&!/^audio\//.test(f.type))return "Format harus berupa audio.";
  if(type==="video"&&!/^video\//.test(f.type))return "Format harus berupa video.";
  return null;
}

function chooseEditorMedia(i,input){
  const f=input.files?.[0];
  if(!f)return;
  const b=editorBlocks[i];
  const err=validateMediaFile(b.type,f);
  if(err){ toast(err); input.value=""; return; }
  if(b.preview) URL.revokeObjectURL(b.preview);
  b.file=f;
  b.preview=URL.createObjectURL(f);
  b.url="";
  b.name=f.name;
  b.caption=b.caption||f.name;
  renderEditorBlocks();
}

function setEditorLayout(k,v){ editorLayout[k]=v; renderLayoutEditor(); }
function addEditorGroup(){ editorGroups.push({name:`Group ${editorGroups.length+1}`,articleIds:[]}); renderEditorGroups(); }
function updateEditorGroupName(i,v){ if(editorGroups[i]) editorGroups[i].name=v; }
function removeEditorGroup(i){ editorGroups.splice(i,1); renderEditorGroups(); }
function assignChildGroup(id,val){
  editorGroups.forEach(g=>g.articleIds=g.articleIds.filter(x=>x!==id));
  if(val!==''&&editorGroups[Number(val)]) editorGroups[Number(val)].articleIds.push(id);
}

async function uploadEditorMedia(block,i){
  if(!block.file) return block.url||"";
  const sizeErr=validateMediaFile(block.type,block.file);
  if(sizeErr) throw new Error(sizeErr);

  const currentUser = auth.currentUser;
  if(!currentUser) throw new Error("Silakan masuk terlebih dahulu.");
  const userId = currentUser.uid;
  const safe = (block.file.name||`media-${i}`).replace(/[^a-zA-Z0-9._-]+/g,"-").slice(-90);
  const filePath = `${userId}/${Date.now()}_${safe}`;

  const { data, error } = await supabaseClient.storage
    .from("media")
    .upload(filePath, block.file, { cacheControl: "3600", upsert: true });

  if (error) throw new Error("Supabase Storage: " + error.message);
  const { data: publicUrlData } = supabaseClient.storage.from("media").getPublicUrl(filePath);
  return publicUrlData.publicUrl;
}

async function saveArticle(){
  if(!user) return login();
  const btn=document.getElementById("btnPublish");
  if(btn?.disabled) return;

  const title=document.getElementById("etitle").value.trim()||"Tanpa Judul";
  const category=document.getElementById("ecat").value.trim()||"Lainnya";
  const tags=document.getElementById("etags").value.split(",").map(x=>x.trim()).filter(Boolean);
  const desc=document.getElementById("edesc").value.trim();
  const spaceId=document.getElementById("espace").value||null;
  const parentId=document.getElementById("eparent").value||null;

  if(!editorBlocks.length) editorBlocks=[{type:"text",text:"",marker:""}];
  if(btn){ btn.disabled=true; btn.dataset.label=btn.textContent; }

  try{
    const filesToUpload=editorBlocks.filter(b=>b.file).length;
    let uploaded=0;
    for(let i=0;i<editorBlocks.length;i++){
      if(editorBlocks[i].file){
        if(btn) btn.textContent=`Mengunggah berkas (${++uploaded}/${filesToUpload})...`;
        editorBlocks[i].url=await uploadEditorMedia(editorBlocks[i],i);
        editorBlocks[i].file=null;
        if(editorBlocks[i].preview){ URL.revokeObjectURL(editorBlocks[i].preview); editorBlocks[i].preview=null; }
      }
    }

    if(btn) btn.textContent="Menyimpan ke Cloud...";
    const blocks=editorBlocks.map(b=>{const x={...b};delete x.file;delete x.preview;return x});
    const content=blocksToHTML(blocks);
    const articleGroups=editorGroups.map(g=>({name:(g.name||"Group").trim()||"Group",articleIds:[...new Set(g.articleIds||[])]})).filter(g=>g.articleIds.length||g.name);
    const layoutConfig={...editorLayout};

    if(editingId){
      const ref=doc(db,"articles",editingId);
      const snap=await getDoc(ref);
      if(!snap.exists()||!canEditArticle({...snap.data(),id:editingId})){
        toast("Kamu tidak memiliki izin mengubah artikel ini.");
        return;
      }
      const newVersion=(snap.data().version||1)+1;
      const patch={title,category,tags,desc,content,blocks,articleGroups,layoutConfig,version:newVersion,updatedAt:serverTimestamp()};
      if(spaceId) patch.spaceId=spaceId; else patch.spaceId=deleteField();
      if(parentId) patch.parentId=parentId; else patch.parentId=deleteField();

      await updateDoc(ref,patch);
      await addDoc(collection(db,"articles",editingId,"revisions"),{
        version:newVersion,title,category,tags,desc,content,blocks,articleGroups,layoutConfig,editedBy:user.uid,editedByName:user.displayName||"Contributor",editedAt:serverTimestamp()
      });
      toast("Artikel berhasil diperbarui");
    } else {
      const slugId=await generateUniqueSlug(`${makeSlug(user.displayName||"user")}-${makeSlug(title)}`);
      const base={
        title,slug:slugId,category,tags,desc,content,blocks,articleGroups,layoutConfig,
        authorId:user.uid,authorName:user.displayName||"Contributor",authorPhoto:user.photoURL||"",
        ownerId:user.uid,views:0,version:1,createdAt:serverTimestamp(),updatedAt:serverTimestamp()
      };
      if(spaceId) base.spaceId=spaceId;
      if(parentId) base.parentId=parentId;

      const ref=doc(db,"articles",slugId);
      await setDoc(ref,base);
      await addDoc(collection(db,"articles",ref.id,"revisions"),{
        version:1,title,category,tags,desc,content,blocks,articleGroups,layoutConfig,editedBy:user.uid,editedByName:user.displayName||"Contributor",editedAt:serverTimestamp()
      });
      toast("Artikel berhasil dipublikasikan");
      editingId=ref.id;
    }
    setTimeout(()=>openArticle(editingId),400);
  } catch(e) {
    toast("Terjadi kesalahan: "+(e.message||e.code));
  } finally {
    if(btn){
      btn.disabled=false;
      btn.textContent=btn.dataset.label||"Terbitkan";
    }
  }
}

// Menghapus file media di Supabase Storage yang terkait sebuah artikel.
// Dipanggil saat artikel dihapus, agar bucket tidak menumpuk file yatim (orphaned).
function extractSupabaseMediaPath(url) {
  const marker = "/storage/v1/object/public/media/";
  const s = String(url || "");
  const idx = s.indexOf(marker);
  if (idx === -1) return null;
  try {
    return decodeURIComponent(s.slice(idx + marker.length));
  } catch (e) {
    return s.slice(idx + marker.length);
  }
}

async function deleteArticleMediaFiles(articleData) {
  const blocks = Array.isArray(articleData?.blocks) && articleData.blocks.length
    ? articleData.blocks
    : htmlToBlocks(articleData?.content || "");
  const paths = blocks
    .filter(b => ["image", "audio", "video", "file"].includes(b?.type) && b?.url)
    .map(b => extractSupabaseMediaPath(b.url))
    .filter(Boolean);
  if (!paths.length) return;
  try {
    const { error } = await supabaseClient.storage.from("media").remove(paths);
    if (error) console.warn("Gagal menghapus sebagian file media di Supabase:", error.message);
  } catch (e) {
    console.warn("Gagal menghapus file media di Supabase:", e);
  }
}

        const articleData=snap.data();

        deleteArticleMediaFiles(articleData);
        toast("Artikel dihapus.");
        home();
      }catch(e){ toast("Gagal menghapus: "+e.message) }
    }
  });
}

let pendingInviteTarget = null;
let _inviteSearchTimer = null;

function debouncedUserSearch(spaceId){
  clearTimeout(_inviteSearchTimer);

}

async function searchUsersForInvite(spaceId){
  const box = document.getElementById("inviteSearchResults");
  const input = document.getElementById("inviteSearch");
  if(!box || !input) return;
  const raw = input.value.trim();
  pendingInviteTarget = null; // ketikan baru membatalkan pilihan sebelumnya
  if(!raw){ box.style.display="none"; box.innerHTML=""; return; }
  const qLower = raw.toLowerCase();
  const s = findSpaces(spaceId);
  const excludeUids = new Set([user?.uid, s?.ownerId, ...Object.keys(s?.members||{})]);
  box.style.display = "block";
  box.innerHTML = `<div class="muted" style="font-size:12px;padding:6px 8px">Mencari...</div>`;
  try {
    const results = new Map();
    const nameSnap = await getDocs(query(
      collection(db,"users"),
      where("displayNameLower",">=",qLower),
      where("displayNameLower","<=",qLower+"\uf8ff"),
      limit(8)
    ));
    nameSnap.docs.forEach(d=>results.set(d.id,{uid:d.id,...d.data()}));

    const idSnap = await getDocs(query(
      collection(db,"users"),
      where("userId",">=",raw),
      where("userId","<=",raw+"\uf8ff"),
      limit(8)
    ));
    idSnap.docs.forEach(d=>results.set(d.id,{uid:d.id,...d.data()}));

    const list = [...results.values()].filter(u=>!excludeUids.has(u.uid));
    if(!list.length){
      box.innerHTML = `<div class="muted" style="font-size:12px;padding:6px 8px">Tidak ada pengguna ditemukan.</div>`;
      return;
    }
    box.innerHTML = list.map(u=>`
      <div class="memberrow" style="cursor:pointer;padding:6px 8px;border-top:none" onclick='window.selectInviteTarget(${JSON.stringify(spaceId)},${JSON.stringify(u.uid)},${JSON.stringify(u.displayName||"Pengguna")},${JSON.stringify(u.userId||"")})'>
        <span class="who">${esc(u.displayName||"Pengguna")} <small class="muted">#${esc(u.userId||"?")}</small></span>
      </div>
    `).join("");
  } catch(e){
    box.innerHTML = `<div class="muted" style="font-size:12px;padding:6px 8px">Pencarian gagal: ${esc(e.message)}</div>`;
    console.warn("Gagal mencari pengguna untuk undangan:", e);
  }
}

async function acceptPendingInvites(currentUser) {
  if (!currentUser?.email) return;
  try {
    const emailKey = currentUser.email.toLowerCase();
    const q = query(collectionGroup(db, "invites"), where("email", "==", emailKey));
    const snap = await getDocs(q);
    let joined = 0;
    for (const inv of snap.docs) {
      const spaceId = inv.ref.parent.parent.id;
      const role = inv.data().role || "contributor";
      try {
        await updateDoc(doc(db, "spaces", spaceId), { [`members.${currentUser.uid}`]: role });
        await deleteDoc(inv.ref);
        joined++;
      } catch (e) {
        console.warn("Undangan belum dapat diselesaikan:", e);
      }
    }
    if (joined) toast(`Kamu resmi tergabung ke ${joined} Space baru.`);
  } catch (e) {
    console.warn("Gagal mengecek undangan pending:", e);
  }
}

const MAILBOX_PAGE_SIZE=20, COMMENT_PAGE_SIZE=20;
let mailboxCursor=null, mailboxHasMore=true;

async function createMailbox(recipientId, data){
  if(!recipientId) return;
  return addDoc(collection(db,"users",recipientId,"mailbox"),{...data,read:false,createdAt:serverTimestamp()});
}
async function updateMailboxBadge(){
  if(!user){const b=document.getElementById('mailboxBadge');if(b)b.style.display='none';return;}
  try{const snap=await getDocs(query(collection(db,"users",user.uid,"mailbox"),where("read","==",false),limit(20)));const b=document.getElementById('mailboxBadge');if(b){const n=snap.size;b.textContent=n>99?'99+':n;b.style.display=n?'inline-flex':'none';}}catch(e){console.warn('Mailbox badge:',e);}
}
async function mailbox(reset=true){
  if(!user) return login(); setNav('mailbox'); history.pushState(null,'',location.pathname+'#/mailbox');
  if(reset){mailboxCursor=null;mailboxHasMore=true;document.getElementById('main').innerHTML=`<div class="sectionhead"><div><h1>Mailbox</h1><p class="muted">Undangan dan aktivitas penting untukmu.</p></div><button class="btn sm" onclick="window.markAllMailboxRead()">Tandai semua dibaca</button></div><div id="mailboxList" class="section"><div class="empty">Memuat pesan...</div></div><div style="text-align:center"><button id="mailboxMore" class="btn">Muat Lebih Banyak</button></div>`;}
  try{let q=query(collection(db,'users',user.uid,'mailbox'),orderBy('createdAt','desc'),limit(MAILBOX_PAGE_SIZE));if(mailboxCursor)q=query(collection(db,'users',user.uid,'mailbox'),orderBy('createdAt','desc'),startAfter(mailboxCursor),limit(MAILBOX_PAGE_SIZE));const snap=await getDocs(q);mailboxCursor=snap.docs.at(-1)||null;mailboxHasMore=snap.size===MAILBOX_PAGE_SIZE;const box=document.getElementById('mailboxList');if(reset)box.innerHTML='';if(!snap.size&&reset)box.innerHTML='<div class="empty">Mailbox masih kosong.</div>';snap.docs.forEach(d=>{const n={id:d.id,...d.data()};box.insertAdjacentHTML('beforeend',mailboxItem(n));if(!n.read)updateDoc(d.ref,{read:true}).catch(()=>{});});const btn=document.getElementById('mailboxMore');if(btn){btn.textContent=mailboxHasMore?'Muat Lebih Banyak':'Tidak ada lagi';btn.disabled=!mailboxHasMore;btn.onclick=()=>mailbox(false);}updateMailboxBadge();refreshUI();}catch(e){document.getElementById('mailboxList').innerHTML='<div class="empty">Gagal memuat Mailbox.</div>';console.warn(e);}
}
function mailboxItem(n){
 const date=n.createdAt?.toDate?.()?.toLocaleString('id-ID')||'baru saja';
 const actions=n.type==='space_invite'&&n.status==='pending'?`<div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary sm" onclick='window.respondSpaceInvite(${JSON.stringify(n.id)},${JSON.stringify(n.spaceId)},true)'>Terima</button><button class="btn sm" onclick='window.respondSpaceInvite(${JSON.stringify(n.id)},${JSON.stringify(n.spaceId)},false)'>Tolak</button></div>`:n.articleId?`<button class="btn sm" style="margin-top:10px" onclick='window.openArticle(${JSON.stringify(n.articleId)})'>Buka Artikel</button>`:'';
 return `<div class="stat" style="padding:16px;margin-bottom:10px"><b>${esc(n.title||'Aktivitas baru')}</b><p class="muted" style="margin:6px 0">${esc(n.message||'')}</p><small class="muted">${date}</small>${actions}</div>`;
}
async function markAllMailboxRead(){if(!user)return;try{const snap=await getDocs(query(collection(db,'users',user.uid,'mailbox'),where('read','==',false),limit(100)));await Promise.all(snap.docs.map(d=>updateDoc(d.ref,{read:true})));updateMailboxBadge();toast('Mailbox diperbarui.');mailbox();}catch(e){toast('Gagal memperbarui Mailbox.');}}
async function respondSpaceInvite(mailId,spaceId,accept){
 if(!user)return;try{const mref=doc(db,'users',user.uid,'mailbox',mailId);if(accept){const sref=doc(db,'spaces',spaceId);const ss=await getDoc(sref);if(!ss.exists())throw new Error('Space sudah tidak tersedia');const members={...(ss.data().members||{})};members[user.uid]='contributor';await updateDoc(sref,{members,updatedAt:serverTimestamp()});await updateDoc(mref,{status:'accepted',read:true,respondedAt:serverTimestamp()});toast('Kamu bergabung ke Space.');}else{await updateDoc(mref,{status:'declined',read:true,respondedAt:serverTimestamp()});toast('Undangan ditolak.');}mailbox();}catch(e){toast('Gagal memproses undangan: '+e.message);}
}

async function loadComments(articleId, reset=true){
 const box=document.getElementById('commentsList');if(!box)return;
 if(reset)box.innerHTML='<div class="empty">Memuat komentar...</div>';
 try{
   const snap=await getDocs(query(collection(db,'articles',articleId,'comments'),orderBy('createdAt','desc'),limit(COMMENT_PAGE_SIZE)));
   const items=snap.docs.map(d=>({id:d.id,...d.data()}));
   const roots=items.filter(c=>!c.parentId);
   const repliesByParent={};
   items.filter(c=>c.parentId).forEach(c=>{ (repliesByParent[c.parentId]=repliesByParent[c.parentId]||[]).push(c); });
   box.innerHTML=roots.length?roots.map(c=>commentItem(articleId,c,repliesByParent)).join(''):'<div class="empty">Belum ada komentar. Jadilah yang pertama memulai diskusi.</div>';
   refreshUI();
 }catch(e){box.innerHTML='<div class="empty">Komentar belum dapat dimuat.</div>';console.warn(e);}
}
function commentItem(articleId,c,repliesByParent={},depth=0){
  const date=c.createdAt?.toDate?.()?.toLocaleString('id-ID')||'baru saja';
  const mine=user&&c.userId===user.uid;
  const canReportComment=user&&!mine;
  const canDeleteThis=mine||isAdmin;
  const children=(repliesByParent[c.id]||[]).slice().sort((a,b)=>(a.createdAt?.toMillis?.()||0)-(b.createdAt?.toMillis?.()||0));
  const childrenHTML=children.map(ch=>commentItem(articleId,ch,repliesByParent,depth+1)).join('');
  const indentStyle=depth>0?`margin-left:${Math.min(depth,3)*16}px;border-left:2px solid var(--line);padding-left:12px`:'';
  return `<div class="stat" style="padding:14px;margin-bottom:10px;${indentStyle}">
    <div style="display:flex;justify-content:space-between;gap:10px"><b>${esc(c.authorName||'Pengguna')}</b><small class="muted">${date}</small></div>
    <p style="margin:8px 0;white-space:pre-wrap">${esc(c.content||'')}</p>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      ${user?`<button class="btn sm" onclick='window.showReplyBox(${JSON.stringify(articleId)},${JSON.stringify(c.id)})'>Balas</button>`:''}
      ${canReportComment?`<button class="btn sm" onclick='window.openCommentReportModal(${JSON.stringify(articleId)},${JSON.stringify(c.id)},${JSON.stringify(c.authorName||'Pengguna')})'><i data-lucide="flag"></i> Laporkan</button>`:''}
      ${canDeleteThis?`<button class="btn sm danger" onclick='window.deleteComment(${JSON.stringify(articleId)},${JSON.stringify(c.id)})'>Hapus${isAdmin&&!mine?' (Admin)':''}</button>`:''}
    </div>
    ${childrenHTML}
    <div id="replies-${esc(c.id)}"></div>
  </div>`;
}
function showReplyBox(articleId,parentId){const el=document.getElementById('replies-'+parentId);if(!el)return;el.innerHTML=`<div style="margin-top:10px"><textarea id="reply-${esc(parentId)}" class="field" placeholder="Tulis balasan..." style="min-height:70px"></textarea><button class="btn primary sm" style="margin-top:6px" onclick='window.sendComment(${JSON.stringify(articleId)},${JSON.stringify(parentId)})'>Kirim Balasan</button></div>`;}
async function sendComment(articleId,parentId=null){
 if(!user)return login();const input=parentId?document.getElementById('reply-'+parentId):document.getElementById('newComment');const content=input?.value.trim();if(!content)return toast('Komentar tidak boleh kosong.');if(content.length>3000)return toast('Komentar terlalu panjang.');try{const a=await ensureArticle(articleId);await addDoc(collection(db,'articles',articleId,'comments'),{content,userId:user.uid,authorName:user.displayName||'Pengguna',authorPhoto:user.photoURL||'',parentId:parentId||null,createdAt:serverTimestamp(),updatedAt:serverTimestamp()});input.value='';if(a?.ownerId&&a.ownerId!==user.uid)createMailbox(a.ownerId,{type:parentId?'comment_reply':'comment',title:parentId?'Balasan komentar baru':'Komentar baru',message:`${user.displayName||'Seseorang'} berkomentar pada "${a.title}"`,articleId,status:'info'}).catch(()=>{});toast('Komentar terkirim.');loadComments(articleId);}catch(e){toast('Gagal mengirim komentar: '+e.message);}}
async function deleteComment(articleId,commentId){
  if(!user)return;
  try{
    const ref=doc(db,'articles',articleId,'comments',commentId);
    const snap=await getDoc(ref);
    if(!snap.exists())return toast('Komentar tidak ditemukan.');
    const isMineComment=snap.data().userId===user.uid;
    if(!isMineComment && !isAdmin) return toast('Kamu tidak dapat menghapus komentar ini.');
    await deleteDoc(ref);
    toast(isAdmin&&!isMineComment?'Komentar dihapus (Admin).':'Komentar dihapus.');
    loadComments(articleId);
  }catch(e){toast('Gagal menghapus komentar: '+e.message);}
}

async function submitCommentReport(articleId, commentId, authorName) {
  const btn = document.getElementById("btnConfirmReport");
  const reason = document.getElementById("reportReasonSelect")?.value;
  const notes = document.getElementById("reportNotesInput")?.value.trim() || "";
  if (!reason) return toast("Pilih alasan pelaporan.");
  if (btn) { btn.disabled = true; btn.textContent = "Mengirim..."; }
  try {
    const reportData = {
      type: "comment",
      articleId,
      commentId,
      commentAuthorName: authorName || "Pengguna",
      reason,
      notes,
      reporterUid: user.uid,
      reporterName: user.displayName || "Pengguna",
      reporterEmail: user.email || "",
      status: "pending",
      createdAt: serverTimestamp()
    };
    await addDoc(collection(db, "reports"), reportData);
    const modal = document.getElementById("reportModalOverlay");
    if (modal) modal.remove();
    toast("Laporan komentar telah dikirim ke Tim Moderator. Terima kasih.");
  } catch (e) {
    toast("Gagal mengirim laporan: " + e.message);
    if (btn) { btn.disabled = false; btn.textContent = "Kirim Laporan"; }
  }
}

// Sinkronisasi Sesi Autentikasi & Hak Akses Admin
onAuthStateChanged(auth, async (currentUser) => {
  user = currentUser;
  const accEl = document.getElementById("account");

  if (!currentUser) {
    isAdmin = false;
    myPublicId = null;
    mySaved = [];
    if (accEl) {
      accEl.innerHTML = `<button class="btn" onclick="window.login()"><i data-lucide="log-in"></i><span>Masuk</span></button>`;
    }
    updateAdminNavigation();
    refreshUI();
    handleRouting();
    return;
  }

  if (accEl) {
    accEl.innerHTML = `<div class="user" onclick="window.profile()"><img src="${esc(currentUser.photoURL||'')}" alt="Avatar"><span>${esc(currentUser.displayName||'Pengguna')}</span></div>`;
  }

  // Dokumen users/{uid} adalah sumber utama role admin.
  // Koleksi admins tetap didukung sebagai fallback agar konfigurasi lama tidak rusak.
  try {
    const userRef = doc(db, "users", currentUser.uid);
    const userSnap = await getDoc(userRef);
    const userData = userSnap.exists() ? userSnap.data() : {};

    isAdmin = userData.role === "admin" || userData.isAdmin === true;

    if (!isAdmin) {
      try {
        const legacyAdminSnap = await getDoc(doc(db, "admins", currentUser.uid));
        isAdmin = legacyAdminSnap.exists();
      } catch (legacyError) {
        console.warn("Fallback koleksi admins gagal:", legacyError);
      }
    }

    mySaved = Array.isArray(userData.savedArticles) ? userData.savedArticles : [];
  } catch (e) {
    console.warn("Gagal membaca profil dan role pengguna:", e);
    isAdmin = false;
    mySaved = [];
  }

  try {
    myPublicId = await getOrAssignUserId(currentUser);
  } catch (e) {
    console.warn("Gagal mengambil public ID:", e);
  }

  try {
    await acceptPendingInvites(currentUser);
  } catch (e) {
    console.warn("Gagal memproses undangan:", e);
  }

  updateAdminNavigation();
  refreshUI();
  handleRouting();
});

// Realtime Router & Firestore Listeners
function handleRouting() {
  const hash = location.hash;
  if (hash.startsWith("#/article/")) {
    const id = parseHashArticleId();
    if (id) openArticle(id); else home();
  } else if (hash === "#/explore") {
    explore();
  } else if (hash === "#/spaces") {
    spacesPage();
  } else if (hash.startsWith("#/spaces/")) {
    const m = hash.match(/^#\/spaces\/(.+)$/);
    if (m) openSpaces(decodeURIComponent(m[1])); else spacesPage();
  } else if (hash === "#/saved") {
    saved();
  } else if (hash === "#/recent") {
    recentPage();
  } else if (hash === "#/profile") {
    profile();
  } else if (hash === "#/admin") {
    adminDashboard();
  } else if (hash.startsWith("#/search")) {
    const params = new URLSearchParams(hash.split("?")[1] || "");
    const q = params.get("q");
    if (q) {
      document.getElementById("search").value = q;
      searchArticles();
    } else home();
  } else {
    home();
  }
}

window.addEventListener("hashchange", handleRouting);
window.addEventListener("focus",()=>{ /* cache tetap dipakai sampai TTL habis untuk menghemat reads */ });

// Do NOT subscribe to the entire articles collection. Pages query only the data they need.
articlesLoadedOnce = true;

async function loadSpacesIfNeeded(force=false){
  if(spaces.length && !force) return spaces;
  try{
    spaces=await cachedQuery("spaces",CACHE_TTL.spaces,async()=>{
      const snap=await getDocs(collection(db,"spaces"));
      return snap.docs.map(d=>({id:d.id,...d.data()}));
    });
  }catch(e){ console.warn("Gagal memuat spaces:",e); }
  return spaces;
}

window.addEventListener("DOMContentLoaded", async () => {
  refreshUI();
  // Tidak lagi memasang realtime listener untuk seluruh koleksi spaces.
  // Data spaces dimuat sesuai kebutuhan dan dicache.
  await loadSpacesIfNeeded();
  if (!articlesLoadedOnce) handleRouting();
});
